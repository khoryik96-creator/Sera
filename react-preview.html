<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>The Quiet Regular — Redirecting</title>
  <script>
    const destination = new URL('./', window.location.href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body>
  <p>Opening the production reader… <a id="productionReader" href="./">Continue</a></p>
  <script>
    document.getElementById('productionReader').href = `./${window.location.search}${window.location.hash}`;
  </script>
</body>
</html>
