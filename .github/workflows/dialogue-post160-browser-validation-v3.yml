name: Dialogue post160 Playwright validation

on:
  push:
    branches:
      - audit/dialogue-highlight-full-repo-post160
    paths:
      - .github/workflows/dialogue-post160-browser-validation-v3.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/dialogue-highlight-full-repo-post160
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/dialogue-post160-browser-validation-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Playwright validation workflow"
          git push
      - name: Install dependencies
        run: |
          npm ci
      - name: Prepare isolated Playwright
        run: |
          PW_BIN=$(npm exec --yes --package=@playwright/test@1.63.0 -- which playwright)
          PW_NODE_MODULES=$(realpath $(dirname "$PW_BIN")/..)
          mkdir -p node_modules/@playwright
          ln -s "$PW_NODE_MODULES/@playwright/test" node_modules/@playwright/test
          ln -s "$PW_NODE_MODULES/playwright" node_modules/playwright
          ln -s "$PW_NODE_MODULES/playwright-core" node_modules/playwright-core
          echo "PW_BIN=$PW_BIN" >> $GITHUB_ENV
      - name: Install browsers
        run: |
          "$PW_BIN" install --with-deps chromium webkit
      - name: Run browser tests
        run: |
          "$PW_BIN" test
      - name: Verify clean branch
        env:
          BASE: 3696e8765ca183261578f5be63e3b1d3546271cb
        run: |
          node -e "const cp=require('child_process'),fs=require('fs'),b=process.env.BASE,files=cp.execFileSync('git',['diff','--name-only',b,'HEAD','--','src/data/seasons','docs/prose'],{encoding:'utf8'}).trim().split('\\n').filter(Boolean),strip=s=>s.replace(/\\[\\[speaker:[a-z0-9_]+\\]\\]/g,'');for(const f of files){const a=cp.execFileSync('git',['show',b+':'+f],{encoding:'utf8',maxBuffer:20*1024*1024}),z=fs.readFileSync(f,'utf8');if(strip(a)!==strip(z))throw new Error('Non-marker prose change: '+f)};console.log('Marker-only proof passed for '+files.length+' source files.')"
          npm run audit:dialogue
          grep -Fq '**752 quoted lines now have no speaker name.**' docs/dialogue-audit/README.md
          grep -Fq '| Season 95 | 156 |' docs/dialogue-audit/README.md
          grep -Fq '| **Total** | **752** |' docs/dialogue-audit/README.md
          git diff --check
          git diff --exit-code -- package.json package-lock.json
          test ! -e .github/workflows/dialogue-post160-browser-validation-v3.yml
          test ! -e .github/workflows/dialogue-post160-browser-validation-v2.yml
          test ! -e .github/workflows/dialogue-post160-browser-validation.yml
          test ! -e .github/workflows/dialogue-post160-final-validation.yml
          test ! -d docs/dialogue-audit/older-residual-review
          ! find docs/dialogue-audit -maxdepth 1 -type f -name '*POST160*' -print -quit | grep -q .
