name: Migrate React runtime imports

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-react-runtime.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convert React preview to repository-owned runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('src/react')
          for path in root.rglob('*.tsx'):
              text = path.read_text()
              text = text.replace("'https://esm.sh/react@19.0.0'", "'react'")
              text = text.replace("'https://esm.sh/react-dom@19.0.0/client'", "'react-dom/client'")

              # react-jsx does not require the default React runtime import.
              text = re.sub(r"import React, \{([^}]+)\} from 'react';", r"import {\1} from 'react';", text)
              text = text.replace("import React from 'react';\n", "")

              if path.as_posix().endswith('app/App.tsx'):
                  text = text.replace('let page: unknown;', 'let page: ReactNode;')
                  if "import type { ReactNode } from 'react';" not in text:
                      text = "import type { ReactNode } from 'react';\n" + text
              if path.as_posix().endswith('features/reader/ReaderContext.tsx'):
                  text = text.replace('children?: unknown', 'children?: ReactNode')
                  if "import type { ReactNode } from 'react';" not in text:
                      text = "import type { ReactNode } from 'react';\n" + text
              if path.as_posix().endswith('features/reader/ReaderPage.tsx'):
                  if "import type { CSSProperties } from 'react';" not in text:
                      text = text.replace("from 'react';\n", "from 'react';\nimport type { CSSProperties } from 'react';\n", 1)
                  text = text.replace(
                      "style={{ '--reader-scale': scale, '--reader-line-height': relaxedSpacing ? 2.05 : 1.82 }}",
                      "style={{ '--reader-scale': scale, '--reader-line-height': relaxedSpacing ? 2.05 : 1.82 } as CSSProperties & { '--reader-scale': number; '--reader-line-height': number }}",
                  )
              path.write_text(text)

          shim = root / 'react-shim.d.ts'
          if shim.exists():
              shim.unlink()

          ts_path = Path('tsconfig.json')
          ts = json.loads(ts_path.read_text())
          ts['compilerOptions']['jsx'] = 'react-jsx'
          ts_path.write_text(json.dumps(ts, indent=2) + '\n')
          PY

      - name: Validate real React type/runtime integration
        run: npm run quality

      - name: Commit runtime migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react tsconfig.json
          git diff --cached --quiet && exit 0
          git commit -m "refactor: use repository-owned React runtime"
          git push
