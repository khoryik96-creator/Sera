name: Normalize lore data formatting

on:
  push:
    branches:
      - audit/highlighted-lore-gaps
    paths:
      - '.github/workflows/normalize-data-format.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/highlighted-lore-gaps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore canonical JSON formatting
        run: node -e "const fs=require('fs'); const p='src/data.json'; const d=JSON.parse(fs.readFileSync(p,'utf8')); fs.writeFileSync(p, JSON.stringify(d,null,2)+'\\n');"
      - name: Verify highlighted lore completeness
        run: node scripts/audit-highlighted-lore.mjs
      - name: Remove one-time workflow
        run: rm -f .github/workflows/normalize-data-format.yml
      - name: Commit formatting repair
        run: |
          git config user.name "khoryik96-creator"
          git config user.email "khoryik96@gmail.com"
          git add -A
          git commit -m "chore: preserve canonical data formatting"
          git push origin HEAD:audit/highlighted-lore-gaps
