name: Dialogue full-repo audit

on:
  push:
    branches:
      - audit/dialogue-highlight-full-repo-post160
    paths:
      - scripts/dialogue-older-residual-review.mjs
      - .github/workflows/dialogue-full-repo-audit.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/dialogue-highlight-full-repo-post160
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate older-season residual review
        run: node scripts/dialogue-older-residual-review.mjs
      - name: Commit review packets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dialogue-audit/older-residual-review
          if git diff --cached --quiet; then
            echo "No review changes"
            exit 0
          fi
          git commit -m "Generate older-season dialogue review packets"
          git push
