name: Apply Shinrin revisions
on:
  push:
    branches:
      - story/next-arc-outline
    paths:
      - .github/workflows/apply-shinrin-revisions.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/next-arc-outline
          fetch-depth: 0
      - run: python scripts/apply_shinrin_revisions.py
      - run: |
          grep -q 'Axtaya' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          grep -q 'Yun dies in Isgard' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          grep -q 'Literal Light Qi and Darkness Qi' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          git rm scripts/apply_shinrin_revisions.py .github/workflows/apply-shinrin-revisions.yml
          git commit -m 'Lock Axtaya and revise Yun and light-dark foundation'
          git push origin HEAD:story/next-arc-outline
