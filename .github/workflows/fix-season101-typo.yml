name: Fix Season 101 typo
on:
  push:
    branches:
      - story/final-arc-phase2-preprose-audit
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/final-arc-phase2-preprose-audit
          fetch-depth: 0
      - name: Fix typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/prose/FINAL_ARC_SEASON101_PROSE_DRAFT_2.md')
          s=p.read_text()
          old="Shinron's northern ports."
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,"Shinrin's northern ports.",1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prose/FINAL_ARC_SEASON101_PROSE_DRAFT_2.md
          git rm .github/workflows/fix-season101-typo.yml
          git commit -m "Fix Season 101 Shinrin typo"
          git push origin HEAD:story/final-arc-phase2-preprose-audit
