name: Patch final arc outline

on:
  push:
    paths:
      - '.github/workflows/patch-final-arc-outline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final arc branch
        uses: actions/checkout@v7
        with:
          ref: story/next-arc-outline
          fetch-depth: 0

      - name: Restructure outline into two-part final arc
        run: python scripts/patch-final-arc-outline.py

      - name: Validate structure
        run: |
          test -f docs/FINAL_ARC_OUTLINE.md
          test ! -f docs/NEXT_ARC_OUTLINE.md
          grep -q 'Part I = Seasons 95–104 / Chapters 301–400' docs/FINAL_ARC_OUTLINE.md
          grep -q 'Part II = Seasons 105–114 / Chapters 401–500' docs/FINAL_ARC_OUTLINE.md
          grep -q '### Chapter 401 — Every Bell Rings Once' docs/FINAL_ARC_OUTLINE.md
          grep -q '### Chapter 500 — The Quiet Regular' docs/FINAL_ARC_OUTLINE.md
          test "$(grep -c '^### Chapter ' docs/FINAL_ARC_OUTLINE.md)" -eq 200
          git diff --check

      - name: Commit final arc outline and remove one-time helpers
        run: |
          rm scripts/patch-final-arc-outline.py
          rm .github/workflows/patch-final-arc-outline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/FINAL_ARC_OUTLINE.md docs/NEXT_ARC_OUTLINE.md scripts/patch-final-arc-outline.py .github/workflows/patch-final-arc-outline.yml
          git commit -m "Expand final arc into two ten-season parts"
          git push origin HEAD:story/next-arc-outline
