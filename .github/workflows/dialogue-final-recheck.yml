name: Dialogue final recheck

on:
  push:
    branches:
      - story/dialogue-audit-final-residuals-s95-s114
    paths:
      - .github/workflows/dialogue-final-recheck.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story/dialogue-audit-final-residuals-s95-s114
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate data and dialogue worklists
        run: |
          npm run prepare:data
          npm run audit:dialogue
          git diff --check
      - name: Commit generated reader data if needed
        run: |
          if git diff --quiet -- src/data.json docs/dialogue-audit; then
            echo 'Generated files already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data.json docs/dialogue-audit
            git commit -m 'Regenerate reader data after dialogue pass'
            git push origin HEAD:story/dialogue-audit-final-residuals-s95-s114
          fi
      - name: Prove all prose edits are marker-only dialogue edits
        env:
          BASE_SHA: f1e44408d3978544c5cd05b84dfad3b5e9282ebc
        run: |
          python - <<'PY'
          import os, re, subprocess, pathlib, sys
          base=os.environ['BASE_SHA']
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','docs/prose'],text=True).splitlines()
          marker=re.compile(r'\[\[speaker:[a-z0-9_]+\]\]')
          bad=[]; placement=[]
          for name in changed:
              old=subprocess.check_output(['git','show',f'{base}:{name}'],text=True)
              new=pathlib.Path(name).read_text()
              if marker.sub('',old)!=marker.sub('',new): bad.append(name)
              for para in re.split(r'\n{2,}',new):
                  if '[[speaker:' not in para: continue
                  stripped=para.strip()
                  m=re.match(r'^\[\[speaker:[a-z0-9_]+\]\](.*)$',stripped,re.S)
                  if not m or not m.group(1).startswith('“') or not re.fullmatch(r'“[\s\S]*”',m.group(1)):
                      placement.append((name,stripped[:180]))
          print('changed prose files',len(changed))
          if bad: print('NON_MARKER_PROSE',*bad,sep='\n')
          if placement:
              print('INVALID_PLACEMENT')
              for x in placement: print(x)
          if bad or placement: sys.exit(1)
          print('All changed prose reduces exactly to speaker-marker edits on dialogue-only paragraphs.')
          PY
      - name: Unit and dialogue tests
        run: |
          npm test
          npm run audit:dialogue
      - name: Full quality and builds
        run: |
          npm run quality
          npm run build
          npm run budget:perf
          npm run build:single
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium webkit
      - name: Chromium regressions and WebKit smoke
        run: npm run test:e2e
      - name: Verify no generated drift
        run: |
          npm run prepare:data
          npm run audit:dialogue
          git diff --check
          git diff --exit-code -- src/data.json docs/dialogue-audit
