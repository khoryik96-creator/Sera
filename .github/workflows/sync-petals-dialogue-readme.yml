name: Sync Petals Dialogue README

on:
  push:
    branches:
      - story/petals-monarch-return-reactions

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[readme-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync README counts
        run: node scripts/sync-petals-dialogue-readme.mjs

      - name: Remove one-shot tooling
        run: |
          rm scripts/sync-petals-dialogue-readme.mjs
          rm .github/workflows/sync-petals-dialogue-readme.yml

      - name: Verify counts and diff
        run: |
          grep -F '**850 quoted lines now have no speaker name.**' docs/dialogue-audit/README.md
          grep -F '| Season 109 | 118 | `season-109.md`' docs/dialogue-audit/README.md
          grep -F '| **Total** | **850** | | |' docs/dialogue-audit/README.md
          git diff --check

      - name: Commit sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sync dialogue audit counts [readme-synced]"
          git push origin HEAD:${{ github.ref_name }}
