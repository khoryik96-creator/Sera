name: Finalize Phase I audit checklist

on:
  push:
    branches:
      - story/final-arc-phase1-audit-map
    paths:
      - scripts/finalize_phase1_audit_checklist.py
      - .github/workflows/finalize-phase1-audit-checklist.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/final-arc-phase1-audit-map
          fetch-depth: 0
      - run: python scripts/finalize_phase1_audit_checklist.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Phase I audit checklist"
          git push origin HEAD:story/final-arc-phase1-audit-map
