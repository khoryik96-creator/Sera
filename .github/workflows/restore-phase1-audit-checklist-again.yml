name: Restore Phase I audit checklist again

on:
  push:
    branches:
      - story/final-arc-phase1-audit-map
    paths:
      - .github/workflows/restore-phase1-audit-checklist-again.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/final-arc-phase1-audit-map
          fetch-depth: 0
      - name: Restore verified checklist
        run: |
          git show e8ce1ea8b8d992f5287ae768a9def51f7de3e6ca:docs/FINAL_ARC_PHASE1_FINAL_AUDIT_CHECKLIST.md > docs/FINAL_ARC_PHASE1_FINAL_AUDIT_CHECKLIST.md
          rm .github/workflows/restore-phase1-audit-checklist-again.yml
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore verified Phase I audit checklist again"
          git push origin HEAD:story/final-arc-phase1-audit-map
