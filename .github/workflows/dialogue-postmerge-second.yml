name: Dialogue postmerge second pass

on:
  push:
    branches:
      - story/dialogue-audit-postmerge-context-and-mixed
    paths:
      - 'scripts/apply-dialogue-postmerge-second.mjs'
      - '.github/workflows/dialogue-postmerge-second.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/dialogue-audit-postmerge-context-and-mixed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize punctuation handling in temporary script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-dialogue-postmerge-second.mjs')
          text = p.read_text()
          text = text.replace('It’s too quiet', r'It\u0027s too quiet')
          old = "if (body.includes(map.snippet)) hits.push(i);"
          new = "if (body.replaceAll('’', '<APOS>').replaceAll(\"'\", '<APOS>').includes(map.snippet.replaceAll('’', '<APOS>').replaceAll(\"'\", '<APOS>'))) hits.push(i);"
          if old not in text:
              raise SystemExit('matcher anchor not found')
          p.write_text(text.replace(old, new))
          PY
      - name: Apply second reviewed mixed-dialogue pass
        run: node scripts/apply-dialogue-postmerge-second.mjs
      - name: Regenerate reader data and dialogue worklists
        run: |
          npm run prepare:data
          npm run audit:dialogue
      - name: Run unit tests
        run: npm test
      - name: Commit second dialogue pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prose src/data/seasons docs/dialogue-audit/season-*.md
          if git diff --cached --quiet; then
            echo "No dialogue changes"
          else
            git commit -m "Add reviewed mixed dialogue speaker cards"
            git push
          fi
