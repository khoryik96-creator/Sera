name: Patch Shinrin name renames

on:
  push:
    branches:
      - story/next-arc-outline
    paths:
      - '.github/workflows/patch-shinrin-name-renames.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/next-arc-outline
          fetch-depth: 0

      - name: Apply approved Shinrin renames
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              r'\bRei Amagiri\b': 'Yurushi Amagiri',
              r'\bRai Kurokawa\b': 'Tsubasa Kurokawa',
              r'\bRen Ishikawa\b': 'Haru Ishikawa',
              r'\bMei Arakawa\b': 'Hana Arakawa',
              r'\bRyo Narukami\b': 'Kenji Narukami',
              r'\bRei\b': 'Yurushi',
              r'\bRai\b': 'Tsubasa',
              r'\bRen\b': 'Haru',
              r'\bMei\b': 'Hana',
              r'\bRyo\b': 'Kenji',
          }

          for path in Path('docs').glob('FINAL_ARC*.md'):
              text = path.read_text(encoding='utf-8')
              original = text
              for pattern, replacement in replacements.items():
                  text = re.sub(pattern, replacement, text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Remove helper workflow
        run: rm -f .github/workflows/patch-shinrin-name-renames.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/patch-shinrin-name-renames.yml
          git commit -m "Lock revised Shinrin character names"
          git push origin HEAD:story/next-arc-outline
