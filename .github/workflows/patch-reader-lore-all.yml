name: Patch all highlighted lore cards

on:
  push:
    paths:
      - '.github/workflows/patch-reader-lore-all.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/reader-lore-all-highlighted
          fetch-depth: 0

      - name: Patch reader lore resolver
        run: node scripts/patch-reader-lore-all.mjs

      - name: Validate targeted changes
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run test/data.test.ts test/ranks.test.ts test/novel.test.ts
          git diff --check

      - name: Commit feature and remove one-time helpers
        run: |
          rm scripts/patch-reader-lore-all.mjs
          rm .github/workflows/patch-reader-lore-all.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react/features/reader/ReaderPage.tsx src/react/styles/contextual-lore.css e2e/contextual-lore.spec.ts scripts/patch-reader-lore-all.mjs .github/workflows/patch-reader-lore-all.yml
          git commit -m "Fix lore cards for all highlighted characters"
          git push origin HEAD:fix/reader-lore-all-highlighted
