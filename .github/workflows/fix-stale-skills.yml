name: Fix stale skills

on:
  push:
    branches:
      - fix/cross-arc-continuity-four

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/cross-arc-continuity-four
          fetch-depth: 0

      - name: Replace stale post-evolution healing art
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/data.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          replacements = []
          for season_no in range(85, 95):
              key = f'season{season_no}'
              for chapter in data.get(key, []):
                  text = chapter.get('text', '')
                  count = text.count('Spring After Snow')
                  if count:
                      chapter['text'] = text.replace('Spring After Snow', 'Sanctuary of Petals')
                      replacements.append((season_no, chapter.get('ep'), chapter.get('title'), count))

          total = sum(item[3] for item in replacements)
          if total != 4:
              raise SystemExit(f'Expected exactly 4 stale Spring After Snow uses in S85-S94, found {total}: {replacements}')

          # Preserve the repository's standard pretty-printed JSON formatting.
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for item in replacements:
              print('REPLACED', item)

          stale = [
              'Spring After Snow', "Heaven's Return", 'Heaven’s Return', 'Silent Winter',
              'Falling Petal Step', 'Ten Thousand Li Beneath One Step',
              'One Petal Before Dawn', 'Winter Moon Severance', 'Winter Mirror',
              'Empty Spring', 'Autumn Without End', 'Winter Has No Horizon', 'Eternal Spring'
          ]
          remaining = []
          for season_no in range(85, 95):
              for chapter in data.get(f'season{season_no}', []):
                  blob = chapter.get('text', '')
                  for old in stale:
                      if old in blob:
                          remaining.append((season_no, chapter.get('ep'), old))
          if remaining:
              raise SystemExit(f'Stale evolved skill candidates remain in S85-S94: {remaining}')
          PY

      - name: Validate story data
        shell: bash
        run: |
          python -m json.tool src/data.json >/dev/null
          git diff --check

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-stale-skills.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.json .github/workflows/fix-stale-skills.yml
          git commit -m "Fix stale evolved skill names in war arc"
          git push origin HEAD:fix/cross-arc-continuity-four
