name: Dialogue prose marker-only verification

on:
  push:
    branches:
      - story/dialogue-audit-final-residuals-s95-s114
    paths:
      - .github/workflows/dialogue-prose-diff-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prove prose changes are speaker markers only
        env:
          BASE_SHA: f1e44408d3978544c5cd05b84dfad3b5e9282ebc
        run: |
          python - <<'PY'
          import os, re, subprocess, pathlib, sys
          base = os.environ['BASE_SHA']
          changed = subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','docs/prose'], text=True).splitlines()
          marker = re.compile(r'\[\[speaker:[a-z0-9_]+\]\]')
          bad = []
          placement = []
          for name in changed:
              old = subprocess.check_output(['git','show',f'{base}:{name}'], text=True)
              new = pathlib.Path(name).read_text()
              if marker.sub('', old) != marker.sub('', new):
                  bad.append(name)
              for para in re.split(r'\n{2,}', new):
                  if '[[speaker:' not in para:
                      continue
                  stripped = para.strip()
                  m = re.match(r'^\[\[speaker:[a-z0-9_]+\]\](.*)$', stripped, re.S)
                  if not m or not m.group(1).startswith('“') or not re.fullmatch(r'“[\s\S]*”', m.group(1)):
                      placement.append((name, stripped[:160]))
          print(f'Checked {len(changed)} changed prose files.')
          if bad:
              print('NON-MARKER PROSE CHANGES:', *bad, sep='\n')
          if placement:
              print('INVALID MARKER PLACEMENT:')
              for item in placement: print(item)
          if bad or placement: sys.exit(1)
          print('All prose differences reduce exactly to speaker-marker changes, and all markers are on dialogue-only paragraphs.')
          PY
