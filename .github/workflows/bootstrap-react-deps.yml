name: Bootstrap React dependencies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-react-deps.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository-owned React runtime and types
        run: |
          npm install --save-exact react@19.0.0 react-dom@19.0.0
          npm install --save-dev --save-exact @types/react@19.0.0 @types/react-dom@19.0.0

      - name: Validate dependency update
        run: npm run quality

      - name: Commit dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: own React runtime dependencies"
          git push
