name: Apply Rhen seclusion and Black Radiance
on:
  push:
    branches: [story/next-arc-outline]
    paths: ['.github/workflows/apply-rhen-seclusion-black-radiance.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/next-arc-outline
          fetch-depth: 0
      - name: Patch planning files
        run: |
          python - <<'PY'
          from pathlib import Path

          # Power baseline: make the six-month seclusion the causal source of Rhen's upgrade.
          p = Path('docs/FINAL_ARC_POWER_OPTIONS.md')
          s = p.read_text()
          old = '''## 2. Locked Rhen — Two-Year Evolution

Rhen gains no mandatory new named technique. His existing arts evolve through dramatically denser, purer qi and greater scale.

### 2.1 Frozen Petals Garden — Energy Condensation

- Roughly **1% of Rhen's current output now carries the effective qi density that previously required 100%**.
- His current full state therefore represents about **100× the effective qi density / usable power** of his prior full state.
- This is not a requirement to narrate every attack as a literal damage multiplier; different arts express the density differently.
- Every offensive art nevertheless has a vastly higher lethal ceiling.
'''
          new = '''## 2. Locked Rhen — Two-Year Evolution

Rhen gains no mandatory new named technique. His existing arts evolve because he deliberately enters another seclusion during the peaceful two-year rebuilding interval and fundamentally changes the density of the qi his body carries.

### 2.1 Six-Month Seclusion — Condensing One Hundred Into One

By this point **Frozen Petals Garden** regenerates Rhen's internal energy so aggressively that his reserve returns from heavy expenditure to effectively full strength in roughly **one day** under normal circumstances.

That regenerative speed creates a new problem: the amount of raw internal energy his body is continuously holding and refilling is becoming too great to leave in its previous diffuse state. Rhen therefore enters seclusion for **more than six months** to compress the same power into a vastly denser form rather than simply allowing the reservoir to keep expanding outward.

The process is deliberately slow despite his regeneration:

- he repeatedly compresses a full reservoir instead of merely spending it;
- **100% of his former full-state energy is condensed into the equivalent of 1% of his new usable reserve**;
- Frozen Petals Garden rapidly refills what is consumed or stabilized during each compression cycle, forcing him to repeat the refinement again and again;
- his meridians, body and passive all have to adapt to carrying the denser qi safely rather than being flooded by an ever-growing diffuse reservoir;
- completing and stabilizing the condensation across his entire reserve takes **over six months**.

When the seclusion is complete:

- **new 1% ≈ old 100%** in effective qi density / usable force;
- **new 100% ≈ old 10,000%**, meaning his full current state carries roughly **100× his previous full-state effective power**;
- this is the intended meaning of the user's **100% × 100** / "100 x 100" description;
- Frozen Petals Garden still regenerates this new ultra-dense reserve extraordinarily quickly, allowing Rhen to recover to full energy in roughly a day after extreme expenditure;
- the feat does not create a new cultivation realm for Rhen. It further proves that normal ranking language is no longer useful for him.

The condensation is also the causal reason his existing techniques and passive evolve in scale and lethality during the two-year interval. **One percent of his present output can reproduce what once required his entire reserve**, while full output has a vastly higher ceiling.

This does not require every attack to be narrated as a literal numerical 100× damage multiplier. Different arts convert the density into speed, control, healing scale, stasis authority, penetration or raw destructive force differently.

### 2.2 Frozen Petals Garden — Violet Petal Aura

After the seclusion, the visible expression of Rhen's qi changes.

- His familiar frozen petals remain the core motif, but they now carry a **pale violet / purple radiance** through their frost-white edges.
- When he is not deliberately suppressing his presence, a faint **purple-tinted frozen-petal aura** drifts around him as condensed qi leaks harmlessly into the air.
- Greater output makes the violet coloration deeper and the petals more numerous.
- This is **not a new element, new technique, corruption state or separate power**. It is the visual consequence of his internal energy becoming extraordinarily concentrated.
- Rhen can still suppress the display when he wants to pass as an ordinary healer or tea-shop worker.
'''
          assert old in s, 'Rhen power block not found'
          s = s.replace(old, new)
          # Renumber following subsections.
          s = s.replace('### 2.2 Sanctuary of Petals', '### 2.3 Sanctuary of Petals')
          s = s.replace('### 2.3 Petals in Stasis', '### 2.4 Petals in Stasis')
          s = s.replace('### 2.4 Petals Beneath a Frozen Moon', '### 2.5 Petals Beneath a Frozen Moon')
          p.write_text(s)

          # Shinrin foundation: lock Black Radiance direction and attacker tier.
          p = Path('docs/FINAL_ARC_SHINRIN_FOUNDATION.md')
          s = p.read_text()
          s = s.replace(
              "Tae's additional skills, the Shinrin ruling-guild name, Sigrun's Domain, and the new light/darkness unranked character remain approval-gated until selected. **Axtaya** is now locked as the name of Shinrin's life-burning amplifier poison, and Yun Shizhen's final fate is locked below.",
              "Tae's additional skills, the Shinrin ruling-guild name, Sigrun's Domain, and the light/darkness master's **personal name** remain approval-gated. **Axtaya**, Yun Shizhen's final fate, the light/darkness master's title **Black Radiance**, his Shinrin-dissident role and his literal Light Qi / Darkness Qi technique direction are now locked below."
          )
          s = s.replace(
              "One of Shinrin's Paragons attacks her. During that attack, **Yun is sexually assaulted**.",
              "One of Shinrin's **four Established Paragons** attacks her. The attacker is not the Peak-Paragon guild leader; the exact officer number and personal identity remain to be named. During that attack, **Yun is sexually assaulted**."
          )
          s = s.replace(
              'Recommended role remains a **Shinrin dissident / former covert operative** who left the ruling guild before the invasion became public.\n\nHe is not automatically heroic and does not instantly become Sera\'s subordinate. His knowledge of Shinrin, Axtaya routes and ruling-guild habits makes him strategically valuable.',
              '**Locked role:** a **Shinrin dissident / former covert operative** who left the ruling guild before the invasion became public.\n\nHe is not automatically heroic and does not instantly become Sera\'s subordinate. His knowledge of Shinrin, Axtaya routes and ruling-guild habits makes him strategically valuable.'
          )
          old = '''### 12.3 Oriental Name / Title Options — NOT LOCKED

The prior **Ren Tsukishiro / Dusk Walker** proposal is discarded.

Name options:

1. **Kanzaki Reito**
2. **Amagiri Seiran**
3. **Kurobane Akito**
4. **Tsukimori Renji**
5. **Shigure Ren**
6. **Mizuhara Kaito**

Title options:

1. **The Black Sun**
2. **Heaven-Eclipsing Saint**
3. **Lord of the Eclipse**
4. **The Lightless Sun**
5. **Black Radiance**
6. **The Eclipse Hand**

The final name and title should be selected separately.
'''
          new = '''### 12.3 Personal Name Pending / Title Locked

The prior **Ren Tsukishiro / Dusk Walker** proposal is discarded.

**Permanent title: Black Radiance.**

The title refers to the contradiction at the heart of his martial path: darkness that can be projected with the same intensity and presence as light.

His personal name remains approval-gated. Current oriental-name options remain:

1. **Kanzaki Reito**
2. **Amagiri Seiran**
3. **Kurobane Akito**
4. **Tsukimori Renji**
5. **Shigure Ren**
6. **Mizuhara Kaito**

Future planning should refer to him as **Black Radiance** until the personal name is selected.
'''
          assert old in s, 'Black Radiance option block not found'
          s = s.replace(old, new)
          s = s.replace('### 12.5 Proposed Skill Set — NOT LOCKED', '### 12.5 Locked Light / Darkness Skill Set')
          s = s.replace('- introduce the new light/darkness unranked figure;', '- introduce **Black Radiance**, the unranked Shinrin light/darkness master;')
          s = s.replace("4. Choose the new unranked light/darkness character's final name and title from the revised oriental options or provide a new one.", "4. Choose **Black Radiance's personal name** from the oriental options or provide a new one; the title itself is locked.")
          s = s.replace('5. Approve / revise the revised **literal Light Qi / Darkness Qi** skill set.', '5. **Light Qi / Darkness Qi skill direction — LOCKED.**')
          s = s.replace('6. Decide whether the new unranked figure is a Shinrin dissident, hermit, border wanderer or other role.', '6. **Black Radiance role — LOCKED:** Shinrin dissident / former covert operative.')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'Six-Month Seclusion' docs/FINAL_ARC_POWER_OPTIONS.md
          grep -q 'new 1% ≈ old 100%' docs/FINAL_ARC_POWER_OPTIONS.md
          grep -q 'purple-tinted frozen-petal aura' docs/FINAL_ARC_POWER_OPTIONS.md
          grep -q 'Permanent title: Black Radiance' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          grep -q 'four Established Paragons' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          grep -q 'Locked Light / Darkness Skill Set' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          git diff --check
      - name: Commit and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FINAL_ARC_POWER_OPTIONS.md docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          git rm .github/workflows/apply-rhen-seclusion-black-radiance.yml
          git commit -m 'Lock Rhen seclusion and Black Radiance direction'
          git push origin HEAD:story/next-arc-outline
