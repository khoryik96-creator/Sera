name: Dialogue post160 clean final validation

on:
  push:
    branches:
      - audit/dialogue-highlight-full-repo-post160
    paths:
      - .github/workflows/dialogue-post160-final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/dialogue-highlight-full-repo-post160
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean temporary audit tooling and refresh README totals
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'docs/dialogue-audit/README.md';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('**755 quoted lines now have no speaker name.**')) throw new Error('Expected old total not found');
          if (!s.includes('| Season 95 | 159 |')) throw new Error('Expected old S95 count not found');
          if (!s.includes('| **Total** | **755** |')) throw new Error('Expected old table total not found');
          s = s.replace('**755 quoted lines now have no speaker name.**', '**752 quoted lines now have no speaker name.**');
          s = s.replace('| Season 95 | 159 |', '| Season 95 | 156 |');
          s = s.replace('| **Total** | **755** |', '| **Total** | **752** |');
          fs.writeFileSync(p, s);
          NODE

          rm -f \
            .github/workflows/dialogue-bidirectional-audit.yml \
            .github/workflows/dialogue-full-repo-audit.yml \
            .github/workflows/dialogue-post160-apply.yml \
            .github/workflows/dialogue-post160-final-validation.yml \
            scripts/apply-post160-dialogue-audit-fixes.mjs \
            scripts/dialogue-bidirectional-context-audit.mjs \
            scripts/dialogue-full-repo-audit-v2.mjs \
            scripts/dialogue-full-repo-audit-v3.mjs \
            scripts/dialogue-full-repo-audit.mjs \
            scripts/dialogue-older-residual-review.mjs \
            scripts/dialogue-ranked-named-candidates.mjs \
            scripts/dialogue-two-name-turn-review.mjs \
            scripts/dialogue-unmarked-mixed-review.mjs \
            docs/dialogue-audit/BIDIRECTIONAL_POST160_REVIEW.md \
            docs/dialogue-audit/FULL_REPO_POST160_AUDIT.md \
            docs/dialogue-audit/FULL_REPO_POST160_AUDIT_V2.md \
            docs/dialogue-audit/FULL_REPO_POST160_AUDIT_V3.md \
            docs/dialogue-audit/FULL_REPO_POST160_COUNTS.json \
            docs/dialogue-audit/FULL_REPO_POST160_COUNTS_V2.json \
            docs/dialogue-audit/FULL_REPO_POST160_COUNTS_V3.json \
            docs/dialogue-audit/RANKED_NAMED_POST160_REVIEW.md \
            docs/dialogue-audit/TWO_NAME_TURN_POST160_REVIEW.md \
            docs/dialogue-audit/UNMARKED_MIXED_POST160_REVIEW.md
          rm -rf docs/dialogue-audit/older-residual-review

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up temporary dialogue audit tooling"
          git push

      - name: Prove source prose changed only by speaker markers
        env:
          BASE: 3696e8765ca183261578f5be63e3b1d3546271cb
        run: |
          node <<'NODE'
          const cp = require('child_process');
          const fs = require('fs');
          const BASE = process.env.BASE;
          const files = cp.execFileSync('git', ['diff','--name-only',BASE,'HEAD','--','src/data/seasons','docs/prose'], {encoding:'utf8'})
            .trim().split('\n').filter(Boolean);
          const strip = s => s.replace(/\[\[speaker:[a-z0-9_]+\]\]/g, '');
          for (const f of files) {
            const oldText = cp.execFileSync('git', ['show', `${BASE}:${f}`], {encoding:'utf8', maxBuffer: 20*1024*1024});
            const newText = fs.readFileSync(f, 'utf8');
            if (strip(oldText) !== strip(newText)) {
              throw new Error(`Non-marker prose change detected in ${f}`);
            }
          }
          console.log(`Marker-only proof passed for ${files.length} source files.`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Regenerate data and dialogue audit
        run: |
          npm run prepare:data
          npm run audit:dialogue

      - name: Verify dialogue residual totals
        run: |
          grep -Fq '**752 quoted lines now have no speaker name.**' docs/dialogue-audit/README.md
          grep -Fq '| Season 95 | 156 |' docs/dialogue-audit/README.md
          grep -Fq '| **Total** | **752** |' docs/dialogue-audit/README.md
          git diff --exit-code -- docs/dialogue-audit src/data/generated

      - name: Unit and quality validation
        run: |
          npm test
          npm run quality

      - name: Build validation
        run: |
          npm run build
          npm run budget:perf
          npm run build:single

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Browser regressions
        run: npm run test:e2e

      - name: Final repository hygiene
        run: |
          git diff --check
          test ! -e .github/workflows/dialogue-bidirectional-audit.yml
          test ! -e .github/workflows/dialogue-full-repo-audit.yml
          test ! -e .github/workflows/dialogue-post160-apply.yml
          test ! -e .github/workflows/dialogue-post160-final-validation.yml
          test ! -e scripts/apply-post160-dialogue-audit-fixes.mjs
          test ! -e scripts/dialogue-bidirectional-context-audit.mjs
          test ! -e scripts/dialogue-full-repo-audit-v2.mjs
          test ! -e scripts/dialogue-full-repo-audit-v3.mjs
          test ! -e scripts/dialogue-full-repo-audit.mjs
          test ! -e scripts/dialogue-older-residual-review.mjs
          test ! -e scripts/dialogue-ranked-named-candidates.mjs
          test ! -e scripts/dialogue-two-name-turn-review.mjs
          test ! -e scripts/dialogue-unmarked-mixed-review.mjs
          test ! -d docs/dialogue-audit/older-residual-review
          ! find docs/dialogue-audit -maxdepth 1 -type f -name '*POST160*' -print -quit | grep -q .
          git status --short
