name: Dialogue bidirectional audit

on:
  push:
    branches:
      - audit/dialogue-highlight-full-repo-post160
    paths:
      - scripts/dialogue-bidirectional-context-audit.mjs
      - .github/workflows/dialogue-bidirectional-audit.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/dialogue-highlight-full-repo-post160
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate bidirectional review
        run: node scripts/dialogue-bidirectional-context-audit.mjs
      - name: Commit review report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dialogue-audit/BIDIRECTIONAL_POST160_REVIEW.md
          if git diff --cached --quiet; then
            echo "No review changes"
            exit 0
          fi
          git commit -m "Generate bidirectional dialogue review"
          git push
