name: Dialogue S95 Guarded
on:
  push:
    branches: [story/dialogue-audit-season95]
    paths: [scripts/run-s95-map-safely.mjs]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story/dialogue-audit-season95
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded Season 95 markers
        run: node scripts/run-s95-map-safely.mjs
      - run: npm run prepare:data
      - run: npm test
      - run: npm run audit:dialogue
      - name: Commit source markers and regenerated worklists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prose/FINAL_ARC_SEASON095_PROSE_DRAFT*.md docs/dialogue-audit
          git commit -m "Resolve named-cast dialogue across Season 95"
          git push
