name: Liang Yue canon correction

on:
  push:
    branches:
      - fix/liang-yue-female-canon

permissions:
  contents: write

jobs:
  correct:
    if: ${{ !contains(github.event.head_commit.message, '[liang-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liang-yue-female-canon
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply residual Liang Yue corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}: {old!r}")
              return text.replace(old, new, 1)

          def edit_chapter(path, chapter_no, next_chapter_no, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              start = text.index(f"## Chapter {chapter_no} —")
              end = text.index(f"## Chapter {next_chapter_no} —", start)
              section = text[start:end]
              for old, new in replacements:
                  section = replace_once(section, old, new, f"{path} Ch{chapter_no}")
              p.write_text(text[:start] + section + text[end:], encoding='utf-8')

          edit_chapter(
              'docs/prose/FINAL_ARC_SEASON107_PROSE_DRAFT.md', 421, 422,
              [
                  ('She did not need to beat her.', 'Liang did not need to beat Nao.'),
                  ('She needed her not to stop the evacuation.', 'She needed Nao not to stop the evacuation.'),
                  ('She gave her less structure to flow around.', 'Liang gave Nao less structure to flow around.'),
                  ('Nao looked past him.', 'Nao looked past her.'),
                  ('She almost smiled.\n\nThen used Mercy Current to redirect a heavy clash from one allied officer nearby and create an escape path.', 'Nao almost smiled.\n\nThen Nao used Mercy Current to redirect a heavy clash from one allied officer nearby and create an escape path.'),
                  ('That meant she could hold her.\n\nNot cheaply defeat him.', 'That meant Nao could hold Liang.\n\nNot cheaply defeat her.'),
                  ('She looked at her.\n\n[[speaker:liang]]“Why?”', 'Liang looked at Nao.\n\n[[speaker:liang]]“Why?”'),
                  ('She smiled and withdrew.', 'Liang smiled and withdrew.'),
              ],
          )

          edit_chapter(
              'docs/prose/FINAL_ARC_SEASON114_PROSE_DRAFT_2.md', 495, 496,
              [
                  ('[[speaker:liang]]Liang Yue, standing beside the second pillar, muttered, “Terrible idea.”\n\nKael looked at him.', '[[speaker:liang]]Liang Yue, standing beside the second pillar, muttered, “Terrible idea.”\n\nKael looked at her.'),
                  ('Liang adjusted one of his three cloaks.', 'Liang adjusted one of her three cloaks.'),
              ],
          )

          print('Applied residual Liang Yue corrections.')

      - name: Verify corrected hotspots
        shell: python
        run: |
          from pathlib import Path
          import re

          s107 = Path('docs/prose/FINAL_ARC_SEASON107_PROSE_DRAFT.md').read_text(encoding='utf-8')
          ch421 = s107[s107.index('## Chapter 421 —'):s107.index('## Chapter 422 —')]
          if re.search(r'\b(?:he|him|his|himself)\b', ch421, re.I):
              print(ch421)
              raise SystemExit('Male pronoun remains in Liang/Nao Chapter 421 duel')

          checks = {
              'docs/prose/FINAL_ARC_SEASON101_PROSE_DRAFT_2.md': [
                  'Liang Yue adjusted one of her unnecessary cloaks.',
                  'Kael looked at her.',
              ],
              'docs/prose/FINAL_ARC_SEASON114_PROSE_DRAFT_2.md': [
                  'Liang adjusted one of her three cloaks.',
              ],
              'docs/FINAL_ARC_TOP_TEN_THIRD_SHOP_ENDING_LOCK.md': [
                  'Liang Yue when one of her "coincidental" excursions overlaps Kael',
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'Missing expected canon text in {path}: {needle}')
          print('Targeted Liang Yue canon assertions passed.')

      - name: Install and validate
        run: |
          npm ci
          npm run prepare:data
          npm test
          npm run quality
          npm run build
          git diff --check

      - name: Commit residual corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prose/FINAL_ARC_SEASON107_PROSE_DRAFT.md \
                  docs/prose/FINAL_ARC_SEASON114_PROSE_DRAFT_2.md \
                  src/data
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Complete Liang Yue female canon corrections [liang-fix-applied]"
          git push origin HEAD:fix/liang-yue-female-canon
