name: Liang Yue canon correction

on:
  push:
    branches:
      - fix/liang-yue-female-canon

permissions:
  contents: write

jobs:
  correct:
    if: ${{ !contains(github.event.head_commit.message, '[liang-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liang-yue-female-canon
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply residual Liang Yue corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}: {old!r}")
              return text.replace(old, new, 1)

          def edit_chapter(path, chapter_no, next_chapter_no, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              start = text.index(f"## Chapter {chapter_no} —")
              end = text.index(f"## Chapter {next_chapter_no} —", start)
              section = text[start:end]
              for old, new in replacements:
                  section = replace_once(section, old, new, f"{path} Ch{chapter_no}")
              p.write_text(text[:start] + section + text[end:], encoding='utf-8')

          edit_chapter(
              'docs/prose/FINAL_ARC_SEASON107_PROSE_DRAFT.md', 421, 422,
              [
                  ('Liang Yue chose neither.\n\nShe simply used less.', 'Liang Yue chose neither.\n\nShe simply used less.'),
                  ('She did not need to beat her.', 'Liang did not need to beat Nao.'),
                  ('She needed her not to stop the evacuation.', 'She needed Nao not to stop the evacuation.'),
                  ('She gave her less structure to flow around.', 'Liang gave Nao less structure to flow around.'),
                  ('Nao looked past him.', 'Nao looked past her.'),
                  ('She almost smiled.\n\nThen used Mercy Current to redirect a heavy clash from one allied officer nearby and create an escape path.', 'Nao almost smiled.\n\nThen Nao used Mercy Current to redirect a heavy clash from one allied officer nearby and create an escape path.'),
                  ('That meant she could hold her.\n\nNot cheaply defeat him.', 'That meant Nao could hold Liang.\n\nNot cheaply defeat her.'),
                  ('She looked at her.\n\n[[speaker:liang]]“Why?”', 'Liang looked at Nao.\n\n[[speaker:liang]]“Why?”'),
                  ('She smiled and withdrew.', 'Liang smiled and withdrew.'),
              ],
          )

          edit_chapter(
              'docs/prose/FINAL_ARC_SEASON114_PROSE_DRAFT_2.md', 495, 496,
              [
                  ('[[speaker:liang]]Liang Yue, standing beside the second pillar, muttered, “Terrible idea.”\n\nKael looked at him.', '[[speaker:liang]]Liang Yue, standing beside the second pillar, muttered, “Terrible idea.”\n\nKael looked at her.'),
                  ('Liang adjusted one of his three cloaks.', 'Liang adjusted one of her three cloaks.'),
              ],
          )

          test = Path('test/liangGenderCanon.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs';
import { resolve } from 'node:path';
import { describe, expect, it } from 'vitest';

const read = (path: string) => readFileSync(resolve(process.cwd(), path), 'utf8');

const season107 = read('docs/prose/FINAL_ARC_SEASON107_PROSE_DRAFT.md');
const season101 = read('docs/prose/FINAL_ARC_SEASON101_PROSE_DRAFT_2.md');
const season114 = read('docs/prose/FINAL_ARC_SEASON114_PROSE_DRAFT_2.md');
const endingLock = read('docs/FINAL_ARC_TOP_TEN_THIRD_SHOP_ENDING_LOCK.md');
const season7 = read('src/data/seasons/season-007.json');

const chapter421 = season107.slice(
  season107.indexOf('## Chapter 421 —'),
  season107.indexOf('## Chapter 422 —'),
);

describe('Liang Yue gender canon', () => {
  it('preserves the established female canon', () => {
    expect(season7).toContain('Liang Yue arrived because the released records named her victory');
    expect(season7).toContain('She did not bring attendants');
  });

  it('keeps the Liang/Nao Season 107 duel free of male pronouns for Liang', () => {
    expect(chapter421).not.toMatch(/\\b(?:he|him|his|himself)\\b/i);
    expect(chapter421).toContain('Liang did not need to beat Nao.');
    expect(chapter421).toContain('Nao looked past her.');
    expect(chapter421).toContain('Liang smiled and withdrew.');
  });

  it('guards the later final-arc and epilogue regressions', () => {
    expect(season101).toContain('Liang Yue adjusted one of her unnecessary cloaks.');
    expect(season101).toContain('Kael looked at her.');
    expect(season114).toContain('Kael looked at her.');
    expect(season114).toContain('Liang adjusted one of her three cloaks.');
    expect(endingLock).toContain('Liang Yue when one of her "coincidental" excursions overlaps Kael');

    const combined = [season101, season107, season114, endingLock].join('\\n');
    expect(combined).not.toContain('Liang Yue adjusted one of his');
    expect(combined).not.toContain('Liang adjusted one of his three cloaks');
    expect(combined).not.toContain('Liang Yue when one of his "coincidental" excursions');
  });
});
""", encoding='utf-8')

          print('Applied residual Liang Yue corrections and added regression guard.')

      - name: Targeted residual scan
        shell: python
        run: |
          from pathlib import Path
          import re

          paths = sorted(Path('docs/prose').glob('FINAL_ARC*.md')) + sorted(Path('docs').glob('FINAL_ARC*.md'))
          male = re.compile(r'\b(?:he|him|his|himself|man|men)\b', re.I)
          liang = re.compile(r'(?:Liang Yue|\bLiang\b|\[\[speaker:liang\]\])', re.I)
          starts_male = re.compile(r'^\s*(?:He|His|Him|Himself)\b')
          candidates = []

          for p in paths:
              text = p.read_text(encoding='utf-8')
              paras = re.split(r'\n\s*\n', text)
              for i, para in enumerate(paras):
                  if liang.search(para) and male.search(para):
                      candidates.append((p, i, 'same', para))
                  if i and starts_male.search(para) and liang.search(paras[i-1]):
                      candidates.append((p, i, 'after-liang', paras[i-1] + '\n\n' + para))
                  if i + 1 < len(paras) and starts_male.search(para) and '[[speaker:liang]]' in paras[i+1]:
                      candidates.append((p, i, 'before-liang-dialogue', para + '\n\n' + paras[i+1]))

          # The scan is deliberately heuristic: print for human review rather than bulk-editing.
          print(f'TARGETED_RESIDUAL_CANDIDATES={len(candidates)}')
          seen = set()
          for p, i, kind, ctx in candidates:
              key = (str(p), i, kind)
              if key in seen:
                  continue
              seen.add(key)
              print(f'--- {p} paragraph#{i+1} [{kind}]\n{ctx.replace(chr(10), " ")[:1000]}')

      - name: Install and validate
        run: |
          npm ci
          npm run prepare:data
          npm test
          npm run quality
          npm run build
          git diff --check

      - name: Commit residual corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prose/FINAL_ARC_SEASON107_PROSE_DRAFT.md \
                  docs/prose/FINAL_ARC_SEASON114_PROSE_DRAFT_2.md \
                  test/liangGenderCanon.test.ts \
                  src/data
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Complete Liang Yue female canon guard [liang-fix-applied]"
          git push origin HEAD:fix/liang-yue-female-canon
