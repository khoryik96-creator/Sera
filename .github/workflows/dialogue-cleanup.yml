name: Dialogue audit cleanup

on:
  push:
    branches:
      - story/dialogue-audit-postmerge-context-and-mixed
    paths:
      - '.github/workflows/dialogue-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/dialogue-audit-postmerge-context-and-mixed
      - name: Remove temporary audit machinery
        run: |
          rm -f \
            .github/workflows/dialogue-cleanup.yml \
            .github/workflows/dialogue-final-corrections.yml \
            .github/workflows/dialogue-inline-residual-scan.yml \
            .github/workflows/dialogue-postmerge-apply.yml \
            .github/workflows/dialogue-postmerge-candidates.yml \
            .github/workflows/dialogue-postmerge-second.yml \
            .github/workflows/dialogue-readme-final.yml \
            .github/workflows/dialogue-wrong-marker-scan.yml \
            scripts/apply-dialogue-final-corrections.mjs \
            scripts/apply-dialogue-postmerge-safe.mjs \
            scripts/apply-dialogue-postmerge-second.mjs \
            scripts/dialogue-postmerge-candidates.mjs \
            scripts/dialogue-residual-inline-attribution.mjs \
            scripts/dialogue-wrong-marker-scan.mjs \
            scripts/split-dialogue-postmerge-reports.mjs \
            scripts/update-dialogue-readme-final.mjs
          rm -f docs/dialogue-audit/_postmerge-*.md
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary dialogue audit tooling"
          git push
