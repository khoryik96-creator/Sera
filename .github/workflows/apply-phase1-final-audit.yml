name: Apply Phase I final audit fixes

on:
  push:
    branches:
      - story/final-arc-phase1-audit-map
    paths:
      - scripts/apply_phase1_final_audit.py
      - .github/workflows/apply-phase1-final-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: story/final-arc-phase1-audit-map
          fetch-depth: 0

      - name: Apply asserted prose fixes
        run: python scripts/apply_phase1_final_audit.py

      - name: Commit corrected prose and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply final Phase I audit fixes"
          git push origin HEAD:story/final-arc-phase1-audit-map
