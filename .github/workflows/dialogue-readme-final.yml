name: Dialogue README final refresh

on:
  push:
    branches:
      - story/dialogue-audit-postmerge-context-and-mixed
    paths:
      - 'scripts/update-dialogue-readme-final.mjs'
      - '.github/workflows/dialogue-readme-final.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/dialogue-audit-postmerge-context-and-mixed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-dialogue-readme-final.mjs
      - name: Commit README refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dialogue-audit/README.md
          if git diff --cached --quiet; then
            echo "README already current"
          else
            git commit -m "Refresh dialogue audit totals and mixed-card guidance"
            git push
          fi
