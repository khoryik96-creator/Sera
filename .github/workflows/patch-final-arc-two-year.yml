name: Patch final arc two-year baseline

on:
  push:
    branches:
      - story/next-arc-outline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: story/next-arc-outline
          fetch-depth: 0

      - name: Rebase master outline to two years after war
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/FINAL_ARC_OUTLINE.md')
          text = p.read_text(encoding='utf-8')

          intro_marker = "\n---\n\n## 1. Inherited Continuity That Is Already Locked\n"
          if intro_marker not in text:
              raise SystemExit('intro marker not found')

          locked = r'''
---

## 0. Locked Final-Arc Opening — Two Years After the War

The final arc begins **two full years after** Chapter 300 and the end of the Wuyue–Isgard war. Any older beat later in this planning document that still reads like an immediate homecoming is subordinate to this time-skip rule and must be rewritten before prose.

The intervening two years are a rebuilding era. Wuyue restores roads, hospitals, armies, sects, fleets, veteran systems and command infrastructure while Isgard remains demonstrably deep enough that the northern threat cannot be treated as solved by one campaign.

Because of how overwhelmingly strong Isgard proved to be, Rhen insists that **Frozen Petals Garden** remain upon **Sera, Qin Luo, Tae Muyeon, Huo Wujin and Lu Weiran** throughout the two-year recovery period. Lu remains a non-combatant; the Garden protects his life and health without manufacturing a martial cultivation path.

### 0.1 Locked Opening Cultivation

| Character / group | Final-arc opening cultivation / status |
|---|---|
| **Rhen** | Beyond ranking / immeasurable; his existing roster has evolved again through far denser qi. |
| **Sera** | **Peak Paragon** · retains **Orchid Dominion** · gains a true Ultimate once its option is selected. |
| **Tae Muyeon** | **High Paragon** · new Domain name/mechanics pending user selection. |
| **Huo Wujin** | **High Paragon** · new Domain name/mechanics pending user selection. |
| **Qin Luo** | **High Paragon** · new Domain name/mechanics pending user selection. |
| **Kael Veyran** | **Newly ascended Paragon** · new Domain name/mechanics pending user selection. |
| **Liang Yue** | **Peak Sovereign**. |
| **Jin Seoryu** | **Peak Sovereign**. |
| **Lei Zhen** | **Peak Sovereign**. |
| **Shen Rui** | **Peak Sovereign**. |
| **Ilyra Serath** | **High Sovereign**. |
| **Mo Qingzhao** | **Newly ascended Sovereign**. |
| **Arin Vale** | **Newly ascended Sovereign**. |
| **Luo Wen** | **Newly ascended Sovereign**. |
| **Yun Shizhen** | **Newly ascended Sovereign**. |
| **Lu Weiran** | Non-combatant; protected by the Garden but not promoted into cultivation. |

### 0.2 Public Wuyue Titles Do Not Change With Cultivation

**Five Sovereigns** and **Five Dukes** remain Wuyue's established public / administrative group names rather than cultivation ceilings.

- Kael remains one of the **Five Sovereigns** even after reaching Paragon.
- Liang, Jin, Lei and Rui remain the other **Five Sovereigns** at Peak Sovereign cultivation.
- Ilyra, Mo, Arin, Luo and Yun remain the **Five Dukes** even though all five now cultivate at Sovereign level.
- Ilyra is the exception within the Five Dukes at **High Sovereign**; the other four are newly ascended Sovereigns.

### 0.3 Locked Rhen Evolution

Rhen gains no mandatory new named technique. His existing arts become far more dangerous because **Frozen Petals Garden** has purified and condensed his qi again.

- **Energy condensation:** roughly **1% of Rhen's current output now carries the effective qi density that previously required 100%**. His current full state therefore represents about **100× the effective qi density / usable power** of his prior full state. Offensive skills have a correspondingly higher lethal ceiling, though Rhen normally moderates output rather than narrating a flat damage multiplier.
- **Sanctuary of Petals:** maximum radius rises to **30 miles** and maximum simultaneous population rises to **100,000**. One catastrophic patient can have lethal poison, destroyed tissue and broken bones repaired in seconds. Roughly **1–100 patients** can be fully restored within minutes. Intermediate loads scale with severity. At the full 100,000-person maximum, complete restoration may require about **2–3 days**. It still cannot resurrect the dead.
- **Petals in Stasis:** maximum radius rises to **10 miles**. Any martial Domain detected inside the active Stasis field is **neutralized immediately** rather than winning or losing a conventional Domain clash. The rule is any Domain, so Rhen cannot casually blanket Sera's active Orchid Dominion with the anti-Domain form of Stasis.
- **Petals Beneath a Frozen Moon:** retains its existing approved 50-mile reach unless later revised. Within that reach it now has **no population cap on allied restoration**: selected allies are healed **instantly regardless of number**, while selected hostile possibilities are also resolved **instantly** into Rhen's chosen peaceful ending.

Detailed selectable Domain and Sera-Ultimate candidates live in `docs/FINAL_ARC_POWER_OPTIONS.md` until the user chooses them.
'''

          text = text.replace(intro_marker, locked + "\n## 1. Inherited Continuity That Is Already Locked\n", 1)

          replacements = {
              "The next arc begins only after the completed end state of **When Wuyue Marches North**.": "The final arc opens two years after the completed end state of **When Wuyue Marches North**. The facts below describe the inherited war-end state; Section 0 contains the later final-arc opening values.",
              "3. Sera is now a true **entry-level Paragon** and possesses the stable Supreme Domain **Orchid Dominion**.": "3. At the end of the war, Sera was a true **entry-level Paragon** with the stable Supreme Domain **Orchid Dominion**; two years later she opens the final arc at **Peak Paragon**.",
              "8. Tae Muyeon, Huo Wujin and Qin Luo are each **Peak Sovereign**.": "8. Tae Muyeon, Huo Wujin and Qin Luo ended the war at **Peak Sovereign**; after two further years beneath Frozen Petals Garden they open the final arc as **High Paragons**.",
              "13. The Top Ten now know Tae, Huo and Qin hold formal positions beneath Sera and reached Peak Sovereign while the northern armies were away. Future arcs must not reset this reveal or make the Top Ten surprised by the same information twice.": "13. The Top Ten know Tae, Huo and Qin hold formal positions beneath Sera and reached Peak Sovereign while the northern armies were away. Their later rise to High Paragon occurs during the two-year rebuilding interval and must be treated as new growth, not a repeated secret-identity reveal.",
              "29. Rhen's two-year emergency extension of **Frozen Petals Garden** to Tae, Huo and Qin must be reviewed after the war. Whether it ends immediately, tapers or remains in some limited emergency form is an approval gate for this arc; no automatic permanent extension is assumed.": "29. After reviewing the Isgard threat, Rhen insists on continuing / renewing **Frozen Petals Garden** over Sera, Qin, Tae, Huo and Lu for the full two-year rebuilding interval. This is now locked rather than an approval gate.",
              "- The Top Ten remember Tae, Huo and Qin are Peak Sovereigns under Sera.": "- The Top Ten remember Tae, Huo and Qin ended the war as Peak Sovereigns under Sera; by the final-arc opening the three have advanced to High Paragon during the two-year rebuilding interval.",
              "## 3. Post-War World Baseline": "## 3. Two Years After War — World Baseline",
              "Wuyue returns victorious in the narrow sense that the invasion threat was neutralized, but the continent is not healthy.": "Two years after returning from Isgard, Wuyue has rebuilt substantially but has not erased the human or institutional cost of the war.",
              "- Each Sovereign must rebuild institutions that spent two years abroad.": "- The Five Sovereigns have spent two years rebuilding institutions that spent two years abroad.",
              "- one new Paragon;": "- one **Peak Paragon**, Sera;",
              "- three Peak Sovereigns with formal offices;": "- three **High Paragons** with formal offices: Tae, Huo and Qin;",
              "- Sera is a Paragon and refuses a new number.": "- Sera is a **Peak Paragon** and still refuses a new public number.",
              "- Tae, Huo and Qin are stronger than many publicly ranked leaders but do not automatically claim Top Ten seats.": "- Tae, Huo and Qin are **High Paragons** but do not automatically claim Top Ten seats; the ranking groups remain public offices as well as measures of cultivation.",
              "| **Sera** | Entry Paragon · Orchid Dominion | Must continue learning Domain judgement; no instant veteran-Paragon mastery. |": "| **Sera** | **Peak Paragon · Orchid Dominion** | Mature Paragon refinement plus a true Ultimate after user selection; no new realm required. |",
              "| **Tae Muyeon** | Peak Sovereign | Public revelation creates political consequence; no automatic Paragon jump. |": "| **Tae Muyeon** | **High Paragon** | New Domain pending selection; iron-horizon identity remains distinct. |",
              "| **Huo Wujin** | Peak Sovereign | Remains under Sera's authority and conditional framework; no repeated “surprise return” beat. |": "| **Huo Wujin** | **High Paragon** | New Domain pending selection; Nine Meridian Wheels remain his foundation. |",
              "| **Qin Luo** | Peak Sovereign | Operational deputy; blindness remains part of how he perceives and fights. |": "| **Qin Luo** | **High Paragon** | New Domain pending selection; blindness remains part of how he perceives and fights. |",
              "| **Kael Veyran** | High Sovereign | Still a major battlefield power despite Sigrun's defeat. |": "| **Kael Veyran** | **Newly ascended Paragon** | First public Five Sovereign to reach Paragon; new Domain pending selection. |",
              "| **Liang Yue** | Mid Sovereign specialist | Threat comes from internal-circulation mastery and White Vein systems, not inflated raw realm. |": "| **Liang Yue** | **Peak Sovereign specialist** | Threat still comes from internal-circulation mastery and White Vein systems, not only raw realm. |",
              "| **Jin Seoryu** | Early Sovereign strategist | Strategic authority remains his defining strength. |": "| **Jin Seoryu** | **Peak Sovereign strategist** | Strategic authority remains his defining strength despite major bodily growth. |",
              "| **Ilyra Serath** | Sovereign | Crownless Host remains independent. |": "| **Ilyra Serath** | **High Sovereign** | Crownless Host remains independent; she remains one of the Five Dukes by title. |",
              "| **Mo Qingzhao** | High Duke | Regent and institutional commander, not a disposable subordinate. |": "| **Mo Qingzhao** | **Newly ascended Sovereign** | Still a Five Duke by title; regent and institutional commander. |",
              "| **Arin Vale** | High Duke | Carries destroyed-army consequences; sect survival matters more than sudden cultivation inflation. |": "| **Arin Vale** | **Newly ascended Sovereign** | Still a Five Duke by title; Silver Horizon's losses remain real. |",
              "| **Luo Wen / Yun Shizhen** | Duke-level specialists | Continue to matter through medicine, logistics, poison and battlefield systems. |": "| **Luo Wen / Yun Shizhen** | **Newly ascended Sovereigns** | Both remain Five Dukes by title and continue to matter through their established specializations. |",
              "- Tae's issue: a Peak Sovereign who could command armies but deliberately accepts Sera's hierarchy.": "- Tae's issue: a High Paragon who could dominate ordinary armies but deliberately accepts Sera's hierarchy.",
              "- Qin's issue: the blind former #6 is now Peak Sovereign, operational deputy and the person most capable of hearing hidden movement across Wuyue.": "- Qin's issue: the blind former #6 is now High Paragon, operational deputy and still defined by resonance rather than omniscience.",
              "### Chapter 301 — Tea Before Reports": "### Chapter 301 — Two Years Beneath the Crooked Sign",
              "The Quaint Teahouse reopens without a victory ceremony. Sera refuses to let the first day home become a council session. Veterans and neighbours arrive for tea, establishing that the continent's greatest concentration of hidden force still has ordinary customers.": "Two years after the war, the Quaint Teahouse is fully alive again rather than newly reopened. Rebuilt roads, veteran clinics and changed customers show time has passed. The ordinary tea room now quietly contains a Peak Paragon, three High Paragons and the man still beyond ranking, yet Rhen remains annoyed by a mundane repair Sera has ignored for months.",
              "### Chapter 304 — Three Peaks at One Table": "### Chapter 304 — Three Paragons at One Table",
              "Sera, Rhen, Tae, Huo, Qin and Lu hold the first private post-war command review. The wartime extension of Frozen Petals Garden becomes an explicit unresolved question rather than silently continuing forever.": "Sera, Rhen, Tae, Huo, Qin and Lu review what two years beneath Frozen Petals Garden changed. Sera is now Peak Paragon; Tae, Huo and Qin are High Paragons; Lu remains stubbornly non-combatant. The scene establishes the chosen new Domains once approved and makes clear that Rhen's protection accelerated their foundations without making any two of them fight alike.",
              "## 23. Season 108 — Five Sovereigns, Three Peaks, One House": "## 23. Season 108 — Five Sovereigns, Three Paragons, One House",
              "Tae's Peak Sovereign control prevents hostile forces from completing the final interval into protected civic centres.": "Tae's High-Paragon Domain control prevents hostile forces from completing the final interval into protected civic centres.",
              "### Chapter 478 — Three Peaks Refuse Promotion": "### Chapter 478 — Three Paragons Refuse Promotion",
              "Tae, Huo and Qin are offered permanent continental military offices within the Mandate.": "Tae, Huo and Qin are offered permanent continental military offices precisely because all three are now High Paragons within Sera's household.",
              "1. No realm above Paragon is introduced by default.\n2. Sera begins the arc as an entry Paragon and improves through efficiency, reserve control, Counter-Bloom precision and judgement.": "1. No realm above Paragon is introduced by default.\n2. Sera begins the arc as a **Peak Paragon** after the two-year rebuilding interval and improves through efficiency, reserve control, Counter-Bloom precision, Ultimate mastery and judgement.",
              "8. Tae, Huo and Qin remain Peak Sovereigns unless a later breakthrough is separately earned and approved.": "8. Tae, Huo and Qin begin as **High Paragons**. No automatic further realm is required during the final arc.",
              "9. The trio should not all reach Paragon together.": "9. The trio have already reached High Paragon during the locked two-year interval; future growth must differentiate their Domains and judgement rather than giving them one synchronized realm jump.",
              "14. Rhen's Ultimate remains unavailable unless explicitly approved.": "14. Rhen's Ultimate remains story-locked from casual use even though its two-year evolution is now defined; actual final-arc activation still requires explicit user approval.",
          }

          for old, new in replacements.items():
              if old not in text:
                  print(f'WARN missing exact replacement: {old[:90]}')
              text = text.replace(old, new)

          # Keep the exact 200-chapter structure and ensure the new locked baseline is present.
          if text.count('### Chapter ') != 200:
              raise SystemExit(f'chapter count changed: {text.count("### Chapter ")}')
          for required in [
              '## 0. Locked Final-Arc Opening — Two Years After the War',
              '**Peak Paragon**',
              '**High Paragon**',
              '**30 miles**',
              '**100,000**',
              '**10 miles**',
              'docs/FINAL_ARC_POWER_OPTIONS.md',
              '### Chapter 500',
          ]:
              if required not in text:
                  raise SystemExit(f'missing required marker: {required}')

          p.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-final-arc-two-year.yml
          git add docs/FINAL_ARC_OUTLINE.md .github/workflows/patch-final-arc-two-year.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Lock two-year final arc power baseline"
          git push origin HEAD:story/next-arc-outline
