name: Petals Monarch Return Polish

on:
  push:
    branches:
      - story/petals-monarch-isgard-return

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[petals-return-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Season 109 return polish
        run: node scripts/apply-petals-monarch-return.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare generated data
        run: npm run prepare:data

      - name: Regenerate dialogue audit
        run: npm run audit:dialogue

      - name: Run unit tests
        run: npm test

      - name: Run quality checks
        run: npm run quality

      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run budget:perf

      - name: Single-file build
        run: npm run build:single

      - name: Diff hygiene
        run: git diff --check

      - name: Remove one-shot tooling and commit
        run: |
          rm scripts/apply-petals-monarch-return.mjs
          rm .github/workflows/petals-monarch-return.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make the Petals Monarch return to Isgard legendary [petals-return-applied]"
          git push origin HEAD:${{ github.ref_name }}
