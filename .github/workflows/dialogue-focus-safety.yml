name: Dialogue Focus Safety

on:
  push:
    branches: [story/dialogue-audit-season95]
    paths:
      - scripts/remove-dialogue-focus-inference.mjs
      - .github/workflows/dialogue-focus-safety.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story/dialogue-audit-season95
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove generic narration-subject inference
        run: node scripts/remove-dialogue-focus-inference.mjs
      - name: Rebuild generated data
        run: npm run prepare:data
      - name: Run tests
        run: npm test
      - name: Refresh dialogue worklists
        run: npm run audit:dialogue
      - name: Commit hardening and regenerated worklists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/final-arc-reader.mjs docs/dialogue-audit
          git diff --cached --quiet && exit 0
          git commit -m "Remove generic narration-subject dialogue inference"
          git push
