name: Snapshot legacy reader

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snapshot-legacy-reader.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve current production shell
        run: |
          test ! -e legacy.html
          cp index.html legacy.html
          cmp --silent index.html legacy.html

      - name: Commit legacy reader snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy.html
          git commit -m "chore: preserve pre-React legacy reader"
          git push
