name: Apply Phase II pre-prose audit

on:
  push:
    branches:
      - story/final-arc-phase2-preprose-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/final-arc-phase2-preprose-audit
          fetch-depth: 0
      - name: Apply asserted continuity replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          phase2 = "docs/FINAL_ARC_PHASE2_SEASON_MAP.md"
          replace_exact(
              phase2,
              "- **Days 1–14:** Wuyue mobilizes; Yurushi dismantles his remaining Shinrin escape routes and defects toward Wuyue; Tsubasa accelerates the invasion from roughly four months away to roughly two weeks.",
              "- **Days 1–14:** Wuyue mobilizes; Yurushi dismantles his remaining Shinrin escape routes and defects toward Wuyue; Shinsei is already in late month three of its four-month readiness cycle, and Tsubasa cuts the remaining weeks to roughly fourteen days."
          )
          replace_exact(
              phase2,
              "# Season 101 — Four Months Become Fourteen Days",
              "# Season 101 — The Remaining Weeks"
          )
          replace_exact(
              phase2,
              "### Chapter 362 — The Door Cannot Be Opened\nSera reaches Rhen's seclusion chamber and confirms he entered the previous day. The previously established warning is repeated plainly: forced interruption after condensation begins can catastrophically damage his meridians and body. Sera does not gamble his life because the timing is cruel.",
              "### Chapter 362 — The Door Cannot Be Opened\nPhase I already showed Sera at Rhen's chamber, so do not replay discovery of the closed door. After the first emergency war council, Sera asks Core / Lu for the formal medical answer: is any safe interruption window left? The answer is no. Condensation has already collapsed inward far enough that forced interruption can catastrophically damage Rhen's meridians and body. Sera accepts that the war must now be planned without him rather than gambling his life for an emergency solution."
          )
          replace_exact(
              phase2,
              "### Chapter 365 — Tsubasa Moves the Calendar\nTsubasa confirms Yun escaped with enough information to compromise the original invasion plan. He knowingly compresses the schedule from roughly four months to approximately two weeks. The gamble is explicit: strike Isgard before Wuyue can fully mobilize, even though the defensive pact is known.",
              "### Chapter 365 — Tsubasa Moves the Calendar\nTsubasa confirms Yun escaped with enough information to compromise the invasion plan. Shinsei is already in late month three of a four-month readiness cycle; the remaining launch window is measured in weeks, not four fresh months. Tsubasa knowingly cuts even that remaining preparation to roughly fourteen days. Haru, as Tsubasa's most trusted strategic mind, correctly identifies what the acceleration sacrifices — deeper Wuyue intelligence, staging redundancy and occupation preparation — and Tsubasa accepts the risk to strike before Wuyue can fully mobilize."
          )
          replace_exact(
              phase2,
              "### Chapter 375 — Eldran Stands Where Maedra Would Have Died\nMaedra is trapped in a killing sequence while Isgard command is already collapsing. Eldran takes the damage needed to keep her alive and survives crippled / permanently retired. Maedra remains critically injured.",
              "### Chapter 375 — Eldran Stands Where Maedra Would Have Died\nWith Isgard command already collapsing, Jun exploits the broken front to drive a Breach killing sequence at the already-wounded Maedra. Eldran physically takes the clean contact meant to finish her. Breach Dominion makes conventional guarding a poor answer once the halberd lands; Eldran survives crippled / permanently retired while Maedra remains critically injured. Jun is disciplined rather than sadistic — Maedra is a battlefield target — preserving the later question of whether this invasion was necessary at all."
          )
          replace_exact(
              phase2,
              "### Chapter 376 — Graven Dominion\nSigrun, newly Paragon, holds an evacuation corridor. The prose demonstrates the Domain physically: serious wounds become graven, repeated strikes against the same region become worse choices, injured joints remain functional longer, and her defensive structure becomes harder to displace as damage accumulates.",
              "### Chapter 376 — Graven Dominion\nSigrun, newly Paragon, holds an evacuation corridor against Kenji and the Shinsei spearhead after Raska's death. This creates the history for their later rematch. The prose demonstrates Graven Dominion physically: serious wounds become graven, repeated strikes against the same region become worse choices, injured joints remain functional longer, and her defensive structure becomes harder to displace as damage accumulates. Kenji leaves the engagement believing he has broken the new Paragon even though the evacuation succeeds."
          )
          replace_exact(
              phase2,
              "### Chapter 380 — You Are Staying Here\nYurushi assumes he will accompany Sera north. She orders him to remain in Wuyue because all ten public Top Ten and Sera are leaving, Rhen is unavailable, and someone who understands Shinsei targeting logic is more valuable at home. Wuyue's expedition departs as Isgard finishes its first month alone.",
              "### Chapter 380 — You Are Staying Here\nYurushi assumes he will accompany Sera north. She orders him to remain in Wuyue because all ten public Top Ten and Sera are leaving, Rhen is unavailable, and someone who understands Shinsei targeting logic is more valuable at home. Around Day 34–35 the main Wuyue expedition sails / begins its final crossing; Isgard has carried roughly three weeks of the invasion without Wuyue's main army, and the crossing now occupies real time before the ~Day-42 arrival."
          )
          replace_exact(
              phase2,
              "### Chapter 390 — Tsubasa Changes the Arithmetic\nTsubasa responds to Jun's temporary removal and Wuyue's full intervention by activating **Kai Moriyama #3 / High Paragon** for Isgard. In parallel, Haru and Hana are committed to the Wuyue contingency. Shinsei's war now expands on both continents.",
              "### Chapter 390 — Tsubasa Changes the Arithmetic\nTsubasa responds to Jun's temporary removal and Wuyue's full intervention by activating **Kai Moriyama #3 / High Paragon** for Isgard. The Haru/Hana Wuyue contingency was already authorized when Wuyue's departure was confirmed and is now underway off-page in parallel; do not imply Tsubasa waited for Jun's defeat to begin the home-front probe. Shinsei's war is now visibly operating on both continents."
          )
          replace_exact(
              phase2,
              "> This season runs in parallel with the early Isgard escalation immediately after Sera / the public Top Ten leave Wuyue.",
              "> This season runs in parallel with the early Isgard escalation immediately after Sera / the public Top Ten leave Wuyue. Chapter 391 must open with an explicit time marker such as **Days earlier, while Wuyue's main expedition was still crossing north...** so the reader understands the chronology rather than thinking the war clock rewound accidentally. By Chapters 396–400 the home-front thread can catch back up to the broader Month-2/3 timeline."
          )
          replace_exact(
              phase2,
              "### Chapter 399 — Tae Arrives Before the Crash\nQuaint scouts / relays report the abnormal output; Qin identifies the pattern without magical continent sensing and sends Tae. Tae arrives while Haru is still inside the third 3× window. Haru initially wounds / drives him back before Iron Chain Dominion starts making hyper-aggression catastrophically expensive.",
              "### Chapter 399 — Tae Arrives Before the Crash\nQuaint scouts / relays begin reporting the abnormal output during Haru's first and second Redline windows. Qin identifies the escalating pattern without magical continent sensing and dispatches Tae before the third dose begins; Tae is already stationed in a neighboring central-response belt after the redistribution. He therefore reaches the fight while Haru is still inside the third 3× window. Haru initially wounds / drives him back before Iron Chain Dominion starts making hyper-aggression catastrophically expensive."
          )
          replace_exact(
              phase2,
              "### Chapter 400 — Take Him Before I Change My Mind\nTae defeats the boosted Haru + Hana combination without pretending it was easy. He does not kill them: objective secured, Sera's lethal-authority rule still matters, and Yurushi / Hana's history complicates the choice. Hana extracts Haru. Tae carries the badly injured Yurushi home. The payoff is that someone finally came back for the man who spent years building escape routes for everyone else.",
              "### Chapter 400 — Take Him Before I Change My Mind\nTae defeats the boosted Haru + Hana combination without pretending it was easy. Haru is collapsing from accumulated Redline damage and Hana uses Hollow Sky / movement skill to extract him. Tae does not abandon the defended node or the critically injured Yurushi merely to chase for an execution; Sera's lethal-authority rule still matters, but strategy is the immediate reason pursuit stops. Tae carries Yurushi home. The payoff is that someone finally came back for the man who spent years building escape routes for everyone else."
          )
          replace_exact(
              phase2,
              "### Chapter 411 — You Were Not Dying\nHana reaches Aya with Haru. Aya reads the three same-day doses directly from the damage pattern and circulation. The personal break is not that Haru used emergency medicine to survive; he used it because he was **losing**.",
              "### Chapter 411 — You Were Not Dying\nResolve the geography explicitly. After Chapter 400, Hana extracts Haru back toward Shinrin, where senior physicians stabilize him but cannot fully solve triple-Redline circulation damage. Only after Aya has experienced the first mass-Redline hospital horror and learned soldiers were misled does Shinsei briefly recall her from Isgard to Shinrin for high-command medical review and Haru's treatment. Aya reads the three same-day doses directly from his damage pattern and circulation. The personal break is not that Haru used emergency medicine to survive; he used it because he was **losing**."
          )
          replace_exact(
              phase2,
              "### Chapter 412 — After the War\nAya confronts Tsubasa directly through the high-command channel / scene chosen in prose. Tsubasa condemns Haru's reckless redosing and tightens repeat-dose controls but refuses to discontinue 3× Redline during the war. He promises reform afterward. Aya recognizes her own old excuse coming back from him.",
              "### Chapter 412 — After the War\nAya confronts Tsubasa face-to-face in Shinrin during the brief medical recall. Tsubasa condemns Haru's reckless redosing and tightens repeat-dose controls but refuses to discontinue 3× Redline during the war. He promises reform afterward. Aya recognizes her own old excuse coming back from him. Aya then returns to the Isgard theater before the Sigrun/Kenji and Aldric/Maedra/Eirik recovery sequence, preserving the later Phase III rule that Tsubasa himself does not relocate to Isgard until after Rhen returns."
          )
          replace_exact(
              phase2,
              "### Chapter 437 — Tsubasa Has Still Not Entered the Field\nShinsei's strongest conventional cultivator remains physically fresh relative to the months-worn forward Paragons. The **Heaven Gate** history is finally told clearly enough to matter: Tsubasa faced **three prepared Paragons**, completed **One Chain Binds Heaven** under that pressure, and emerged as a Peak Paragon. Combined with Seven Bridges and Kai's old victory over his younger self, the legend shows evolution rather than effortless predestination. The war has still not seen Shinsei's ultimate martial reserve. Do not reveal his new Redline apex package in full yet.",
              "### Chapter 437 — Tsubasa Has Still Not Entered the Field\nShinsei's strongest conventional cultivator remains physically fresh relative to the months-worn forward Paragons, and the prose must explain why: he is head of state / central command, protects Shinrin's homeland and war-production center, preserves the apex reserve while Shunto handles internal security, and believes the deeper army plus deployed Paragons can still win without gambling the state center. The hidden Tae/Huo/Qin reveal makes leaving Shinrin even less attractive because Wuyue's unseen depth is now proven larger than Shinsei modeled. The **Heaven Gate** history is finally told clearly enough to matter: Tsubasa faced **three prepared Paragons**, completed **One Chain Binds Heaven** under that pressure, and emerged as a Peak Paragon. Combined with Seven Bridges and Kai's old victory over his younger self, the legend shows evolution rather than effortless predestination. Do not reveal his new Redline apex package in full yet."
          )

          lock = "docs/FINAL_ARC_PHASE1_PHASE2_CONTINUITY_LOCK.md"
          replace_exact(
              lock,
              "The original Shinsei invasion schedule is roughly four months away. Yun escapes with warning, so Tsubasa compresses the timetable to approximately **two weeks**, accepting incomplete Wuyue intelligence in exchange for striking before Wuyue can mobilize.",
              "Shinsei is already late in its established four-month readiness cycle when Yun escapes: her final evidence places the launch window in the remaining weeks of late month three. Once her warning succeeds, Tsubasa compresses **that remaining preparation** to approximately **two weeks**, accepting incomplete Wuyue intelligence and thinner staging redundancy in exchange for striking before Wuyue can finish mobilizing."
          )

          s109 = "docs/prose/FINAL_ARC_SEASON109_PROSE_DRAFT.md"
          replace_exact(
              s109,
              "“Shinsei attacked in roughly two weeks. They originally had months. Yun's escape forced Tsubasa Kurokawa to accelerate.”",
              "“Shinsei attacked in roughly two weeks. Yun had placed them late in a four-month readiness cycle; the remaining launch window was already measured in weeks. Once her warning got out, Tsubasa cut even that down.”"
          )

          audit = "docs/FINAL_ARC_PHASE2_PREPROSE_AUDIT_LOCK.md"
          replace_exact(
              audit,
              "- [ ] Normalize stale Chapter 442 “originally had months” prose line on this branch.",
              "- [x] Stale Chapter 442 ‘originally had months’ prose line normalized on this branch."
          )
          PY
      - name: Commit normalized map and seam
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FINAL_ARC_PHASE2_SEASON_MAP.md docs/FINAL_ARC_PHASE1_PHASE2_CONTINUITY_LOCK.md docs/prose/FINAL_ARC_SEASON109_PROSE_DRAFT.md docs/FINAL_ARC_PHASE2_PREPROSE_AUDIT_LOCK.md
          git rm .github/workflows/apply-phase2-preprose-audit.yml
          git commit -m "Normalize Phase II pre-prose continuity seams"
          git push origin HEAD:story/final-arc-phase2-preprose-audit
