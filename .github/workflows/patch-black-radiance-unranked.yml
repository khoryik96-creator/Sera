name: Patch Black Radiance unranked status
on:
  push:
    branches:
      - story/next-arc-outline
    paths:
      - .github/workflows/patch-black-radiance-unranked.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/next-arc-outline
          fetch-depth: 0
      - name: Patch canon lock
        run: |
          python -c 'from pathlib import Path; p=Path("docs/FINAL_ARC_CANON_LOCK.md"); s=p.read_text(); old="- Public status: unranked."; new="- Public status: **unranked in Shinrin by deliberate choice**. Black Radiance dislikes attention, avoids public rankings, ceremonies and formal officer status, and prefers covert work. Only a small number of senior Shinrin insiders understand that his true cultivation is Established Paragon; he is therefore **not counted among Shinrin\u0027s official ten Paragon officers** despite being strong enough to stand among them."; assert old in s; p.write_text(s.replace(old,new))'
      - name: Commit and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FINAL_ARC_CANON_LOCK.md
          git rm .github/workflows/patch-black-radiance-unranked.yml
          git commit -m 'Lock Black Radiance unranked Shinrin status'
          git push origin HEAD:story/next-arc-outline
