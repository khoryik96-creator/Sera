name: Apply cross-phase audit fixes

on:
  push:
    branches:
      - story/final-arc-phase1-audit-map
    paths:
      - scripts/apply_cross_phase_audit_fixes.py
      - .github/workflows/apply-cross-phase-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: story/final-arc-phase1-audit-map
          fetch-depth: 0

      - name: Apply asserted cross-phase fixes
        run: python scripts/apply_cross_phase_audit_fixes.py

      - name: Commit corrected map and prose
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply cross-phase audit fixes"
          git push origin HEAD:story/final-arc-phase1-audit-map
