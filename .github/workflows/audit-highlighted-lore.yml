name: Apply highlighted lore completeness fix

on:
  push:
    branches:
      - audit/highlighted-lore-gaps
    paths:
      - '.github/workflows/audit-highlighted-lore.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/highlighted-lore-gaps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply lore backfill
        run: node scripts/apply-highlighted-lore-fix.mjs
      - name: Audit all highlighted names
        run: node scripts/audit-highlighted-lore.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Remove one-time audit scaffolding
        run: |
          rm -f .github/workflows/audit-highlighted-lore.yml
          rm -f docs/HIGHLIGHTED_LORE_AUDIT.md
          rm -f scripts/apply-highlighted-lore-fix.mjs
      - name: Commit validated fix
        run: |
          git config user.name "khoryik96-creator"
          git config user.email "khoryik96@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: complete highlighted character lore metadata"
          git push origin HEAD:audit/highlighted-lore-gaps
