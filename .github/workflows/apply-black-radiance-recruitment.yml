name: Apply Black Radiance recruitment revision
on:
  push:
    branches: [story/next-arc-outline]
    paths: ['.github/workflows/apply-black-radiance-recruitment.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/next-arc-outline
          fetch-depth: 0
      - name: Patch recruitment canon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/FINAL_ARC_SHINRIN_FOUNDATION.md')
          s = p.read_text()

          s = s.replace(
            "The intended induction point is roughly **the third month of Rhen's seclusion**: late enough that Sera, Tae, Huo, Qin, Kael and the Isgard side have had time to test his loyalty, but early enough that Black Radiance becomes part of the alliance while the Shinrin war is still escalating. **Sera makes the recruitment decision while Rhen is unavailable.**",
            "Black Radiance defects **shortly after Yun's death is confirmed**, during the opening weeks of Rhen's seclusion. His formal induction into the Quaint Teahouse also happens early in the crisis rather than months later, after Sera has personally seen enough of his conduct and background to trust him. **Sera makes the recruitment decision while Rhen is unavailable.**"
          )

          s = s.replace(
            "**Locked role:** a **Shinrin dissident / former covert operative** who left the ruling guild before the invasion became public.\n\nHe is not automatically heroic and does not instantly become Sera's subordinate. His knowledge of Shinrin, Axtaya routes and ruling-guild habits makes him strategically valuable.",
            "**Locked role:** a **Shinrin dissident / former covert operative** whose break with the ruling guild becomes final shortly after Yun Shizhen's death. He has disliked Shinrin's growing corruption for years and is one of the increasingly rare senior figures who genuinely wants peace rather than conquest. He also genuinely enjoys tea, which becomes an unexpectedly ordinary point of connection with Sera.\n\nBefore he has any idea the Quaint Teahouse exists, Black Radiance has already been using his strength to help civilians, move endangered families out of military routes, interfere with abusive requisitions and quietly protect people who cannot protect themselves. His kindness is therefore not performed to win Wuyue's trust.\n\nHe is not automatically heroic and does not instantly become Sera's subordinate. His knowledge of Shinrin, Axtaya routes and ruling-guild habits makes him strategically valuable, but **his recruitment is based on character and demonstrated choices, not merely intelligence value or Established-Paragon strength**."
          )

          marker = "His Established-Paragon Domain is permanently named **Twilight Dominion**.\n\n### 12.2 Narrative Role"
          # no-op marker used only to assert the current structure is present
          assert marker in s

          insert_after = "His knowledge of Shinrin, Axtaya routes and ruling-guild habits makes him strategically valuable, but **his recruitment is based on character and demonstrated choices, not merely intelligence value or Established-Paragon strength**.\n"
          recruitment = """

#### Recommended fluid recruitment route

The cleanest recruitment is a short character arc rather than a single offer.

1. **Yun is the final break, not the beginning of his conscience.** Black Radiance has already been quietly disobeying corrupt Shinrin practices and helping ordinary people before Yun ever arrives. Yun's assault and death prove to him that the guild he once believed preserved peace has become something he can no longer excuse.
2. **He defects without seeking Wuyue.** His first actions after breaking with Shinrin are to open evacuation routes, destroy or expose Axtaya supply points, protect civilians and interfere with invasion preparations. He does this before knowing about the Quaint Teahouse and without expecting sanctuary or rank.
3. **Sera meets him through the people he helped.** Quaint Teahouse scouts repeatedly encounter villages, refugees or wounded travelers who describe an unnamed light-and-darkness master who protected them and disappeared. Sera follows that trail expecting a Shinrin operative and finds Black Radiance instead.
4. **Their first encounter is wary but unexpectedly easy.** Black Radiance and Sera trade dry, friendly banter over tea while both remain fully aware the other could be dangerous. His enjoyment of tea gives the scene warmth without making instant trust believable.
5. **He tells Sera the uncomfortable version of his past.** He does not present himself as a flawless rebel. He explains that he once believed Shinrin's centralized rule prevented endless clan wars, served it sincerely, saw the corruption growing, compromised for too long, and eventually began helping people in secret. Yun's fate is what ends his remaining willingness to look away. He gives Sera names, failures and choices that make him look worse as well as better.
6. **Sera verifies the man through actions, not confession.** Lu's intelligence network and Isgard testimony confirm that the civilian rescues and sabotaged abuses predate his defection. He then makes at least one costly choice that benefits civilians or Wuyue/Isgard without improving his own bargaining position.
7. **Sera offers belonging, not employment.** She does not ask him to become a public Wuyue officer or fill the vacant Top Ten seat. She tells him that the kind of work he has already chosen to do is exactly what the Quaint Teahouse exists for. The offer of **Sixth Petal** therefore names something he has effectively already become.

The induction should occur **within the first several weeks after Yun's death**, while Rhen remains in seclusion. Rhen remains the **Hidden Petal** and is not displaced by the new title.
"""
          assert recruitment.strip() not in s
          s = s.replace(insert_after, insert_after + recruitment)

          s = s.replace(
            "- is recruited by **Sera around the third month of Rhen's seclusion** and becomes the **Sixth Petal** while the public Top Ten seat remains empty;",
            "- defects shortly after Yun's death and is recruited by **Sera within the opening weeks of Rhen's seclusion** as the **Sixth Petal**, while the public Top Ten seat remains empty;"
          )
          s = s.replace(
            "6. **Black Radiance role — LOCKED:** Shinrin dissident / former covert operative; **Established Paragon**; recruited by Sera as the **Sixth Petal** around month three of Rhen's seclusion; Rhen remains Hidden Petal; Black Radiance does **not** take the vacant public Top Ten seat.",
            "6. **Black Radiance role — LOCKED:** Shinrin dissident / former covert operative; **Established Paragon**; defects shortly after Yun's death and is recruited by Sera as the **Sixth Petal** within the opening weeks of Rhen's seclusion; Rhen remains Hidden Petal; Black Radiance does **not** take the vacant public Top Ten seat."
          )
          p.write_text(s)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          grep -q "defects shortly after Yun's death" docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          grep -q 'Recommended fluid recruitment route' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          grep -q 'within the first several weeks' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          git rm .github/workflows/apply-black-radiance-recruitment.yml
          git commit -m 'Refine Black Radiance defection and Sixth Petal recruitment'
          git push origin HEAD:story/next-arc-outline
