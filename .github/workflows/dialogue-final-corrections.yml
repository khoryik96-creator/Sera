name: Dialogue final corrections

on:
  push:
    branches:
      - story/dialogue-audit-postmerge-context-and-mixed
    paths:
      - 'scripts/apply-dialogue-final-corrections.mjs'
      - '.github/workflows/dialogue-final-corrections.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/dialogue-audit-postmerge-context-and-mixed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-dialogue-final-corrections.mjs
      - name: Regenerate worklists and data
        run: |
          npm run prepare:data
          npm run audit:dialogue
      - run: npm test
      - name: Commit final corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prose src/data/seasons docs/dialogue-audit/season-*.md
          if git diff --cached --quiet; then
            echo "No corrections to commit"
          else
            git commit -m "Finish final dialogue speaker corrections"
            git push
          fi
