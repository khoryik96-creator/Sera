name: Fix Phase II final seam
on:
  push:
    branches:
      - story/final-arc-phase2-preprose-audit
    paths:
      - .github/workflows/fix-phase2-final-seam.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/final-arc-phase2-preprose-audit
          fetch-depth: 0
      - name: Fix Ch440 to Ch441 staging
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/prose/FINAL_ARC_SEASON108_PROSE_DRAFT_2.md')
          s = p.read_text()
          start = s.index('Rhen stood.\n\nThe movement felt ordinary.')
          end = s.index('\n---\n\n**End of Phase II.**', start)
          replacement = '''Rhen did not stand yet.

The movement could wait.

For six months the outer seal had answered every inspection with the same quiet refusal.

Not finished.

Do not open.

Then, somewhere beyond the stone, one locking pin withdrew.

Rhen looked toward the door.

A second pin followed.

Not an alarm.

Not damage.

Completion.

The seal opened only far enough for one person to enter.

Lu Weiran stepped through carrying a ledger.

He stopped.

For one second, the most competent man in the Quaint Teahouse forgot every word he knew.

Rhen remained seated on the low platform.

His dark green traveling coat was still folded beside him exactly where Sera had left it.

The lamp niche had accumulated a pale ridge of old wax. Medical ledgers sat beyond the doorway where there had once been none. Lu looked older in a way six months should not have managed by themselves.

That was enough to make the faint humor leave Rhen's face.

The seal settled closed behind Lu again, no longer dangerous to open now that the condensation had completed.

Rhen looked at him.

“Lu.”

Lu's grip tightened around the ledger.

Rhen glanced once at the changed chamber, then back at the man standing in front of him.

His voice stayed quiet.

“How long?”
'''
          s2 = s[:start] + replacement + s[end:]
          assert s2.count('Rhen opened his eyes.') == 1
          assert s2.count('“How long?”') >= 1
          p.write_text(s2)
          Path('.github/workflows/fix-phase2-final-seam.yml').unlink()
          PY
      - name: Commit seam fix
        run: |
          git config user.name khoryik96-creator
          git config user.email khoryik96@gmail.com
          git add docs/prose/FINAL_ARC_SEASON108_PROSE_DRAFT_2.md .github/workflows/fix-phase2-final-seam.yml
          git commit -m "Fix Phase II to Phase III awakening seam"
          git push origin HEAD:story/final-arc-phase2-preprose-audit
