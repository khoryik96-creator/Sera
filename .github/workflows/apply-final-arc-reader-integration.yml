name: Apply final arc reader integration

on:
  push:
    branches:
      - story/integrate-final-arc-reader
    paths:
      - .github/workflows/apply-final-arc-reader-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/integrate-final-arc-reader
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply asserted source patches
        run: node scripts/apply-final-arc-reader-integration.mjs
      - name: Remove one-shot migration files
        run: rm .github/workflows/apply-final-arc-reader-integration.yml scripts/apply-final-arc-reader-integration.mjs
      - name: Commit integration
        run: |
          git config user.name khoryik96-creator
          git config user.email khoryik96@gmail.com
          git add src/episodeMeta.ts src/characterRegistry.ts src/novel.ts src/react/styles/global.css test/data.test.ts .github/workflows/apply-final-arc-reader-integration.yml scripts/apply-final-arc-reader-integration.mjs
          git commit -m "Wire final arc into reader archive"
          git push origin HEAD:story/integrate-final-arc-reader
