name: Patch Shinrin Isgard History
on:
  push:
    branches:
      - story/next-arc-outline
    paths:
      - .github/workflows/patch-shinrin-isgard-history.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/next-arc-outline
          fetch-depth: 0
      - name: Update canon lock
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/FINAL_ARC_CANON_LOCK.md')
          s = p.read_text()
          s = s.replace(
              '8. **Specific historic ties between selected Shinrin Paragons and existing Wuyue Top Ten members.**',
              '8. **Officer #9 former-Isgard-leader details:** exact old title, disappearance, reason for entering Shinrin, relationship to current Isgard leadership, and eventual fate.'
          )
          s = s.replace(
              '- one or two officers with pre-existing history involving Wuyue Top Ten members **other than Sera and Rhen**.',
              '- **Officer #9 is reserved as a former leader of Isgard**, now a Stable Paragon within Shinrin. Isgard may know the man from history, but neither Isgard nor Wuyue knew Shinrin existed through him.\n- **No Shinrin Paragon has a pre-existing personal history with Jin Seoryu or any other Wuyue Top Ten member before this arc.** Shinrin must remain genuinely unknown to Wuyue.'
          )
          s = s.replace(
              'Create 3–4 non-war relationships that make the enemy side human:',
              'Create 3–4 non-war relationships that make the Shinrin side human. These relationships should be internal to Shinrin / Black Radiance or tied to Isgard history, **not retroactive Wuyue friendships**, because Wuyue did not know Shinrin existed:'
          )
          marker = '## Step 2 — Build Shinrin\'s internal history and corruption arc'
          assert marker in s
          insert = '''\n### Locked discovery rule before Step 2\n\n- **Wuyue has no prior knowledge of Shinrin as a martial power or political entity.**\n- Do not create old Jin / Kael / Liang / Lei / Rui / other Wuyue-Top-Ten relationships with Shinrin officers.\n- Any historical reveal should come through **Isgard**, especially Officer #9.\n- **Officer #9 — LOCKED CONCEPT:** one of Shinrin's Stable Paragons is a **former leader of Isgard** from an earlier generation. He disappeared / was believed dead or permanently lost before the present era and later became part of Shinrin. The exact circumstances remain pending.\n- His eventual reveal should shock Isgard because they recognize the man, while Wuyue learns both his identity and Shinrin's history for the first time.\n\n'''
          if '### Locked discovery rule before Step 2' not in s:
              s = s.replace(marker, insert + marker)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'former leader of Isgard' docs/FINAL_ARC_CANON_LOCK.md
          grep -q 'No Shinrin Paragon has a pre-existing personal history with Jin Seoryu' docs/FINAL_ARC_CANON_LOCK.md
          git diff --check
      - name: Commit and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FINAL_ARC_CANON_LOCK.md
          git rm .github/workflows/patch-shinrin-isgard-history.yml
          git commit -m 'Lock Shinrin discovery rule and former Isgard leader'
          git push origin HEAD:story/next-arc-outline
