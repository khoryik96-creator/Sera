name: Fix Petals Monarch Timeline

on:
  push:
    branches:
      - story/petals-monarch-isgard-return

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[timeline-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply timeline fix
        run: node scripts/fix-petals-monarch-timeline.mjs

      - name: Remove one-shot tooling
        run: |
          rm scripts/fix-petals-monarch-timeline.mjs
          rm .github/workflows/fix-petals-monarch-timeline.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run prepare:data
          npm run audit:dialogue
          npm test
          npm run quality
          npm run build
          npm run budget:perf
          npm run build:single
          git diff --check

      - name: Commit timeline correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Season 109 Isgard-war timeline references [timeline-fixed]"
          git push origin HEAD:${{ github.ref_name }}
