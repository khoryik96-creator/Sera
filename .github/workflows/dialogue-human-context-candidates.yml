name: Dialogue human-context pass

on:
  push:
    branches:
      - story/dialogue-audit-final-residuals-s95-s114
    paths:
      - scripts/apply-dialogue-human-context-pass.mjs
      - .github/workflows/dialogue-human-context-candidates.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story/dialogue-audit-final-residuals-s95-s114
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply reviewed human-context markers
        run: node scripts/apply-dialogue-human-context-pass.mjs
      - name: Regenerate dialogue audit
        run: npm run audit:dialogue
      - name: Refresh README residual counts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const counts={};
          let total=0;
          for(let s=95;s<=114;s++){
            const p=`docs/dialogue-audit/season-${String(s).padStart(3,'0')}.md`;
            const txt=fs.readFileSync(p,'utf8');
            const m=txt.match(/\n(\d+) quoted lines in this season have no speaker\./);
            if(!m) throw new Error(`Missing count in ${p}`);
            counts[s]=Number(m[1]); total+=counts[s];
          }
          const p='docs/dialogue-audit/README.md';
          let txt=fs.readFileSync(p,'utf8');
          txt=txt.replace(/The result is that \*\*\d+ quoted lines now have no speaker name\.\*\*/,`The result is that **${total} quoted lines now have no speaker name.**`);
          for(let s=95;s<=114;s++){
            const re=new RegExp(`(\\| Season ${s} \\| )\\d+( \\| \\`season-${String(s).padStart(3,'0')}\\.md\\`)`);
            txt=txt.replace(re,`$1${counts[s]}$2`);
          }
          txt=txt.replace(/\| \*\*Total\*\* \| \*\*\d+\*\* \|/,`| **Total** | **${total}** |`);
          fs.writeFileSync(p,txt);
          console.log('README_TOTAL',total,counts);
          NODE
      - name: Verify whitespace
        run: git diff --check
      - name: Commit reviewed dialogue batch
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prose docs/dialogue-audit
          git commit -m 'Highlight additional context-proven dialogue'
          git push origin HEAD:story/dialogue-audit-final-residuals-s95-s114
