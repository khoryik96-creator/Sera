name: Dialogue wrong marker scan

on:
  push:
    branches:
      - story/dialogue-audit-postmerge-context-and-mixed
    paths:
      - 'scripts/dialogue-wrong-marker-scan.mjs'
      - '.github/workflows/dialogue-wrong-marker-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/dialogue-audit-postmerge-context-and-mixed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/dialogue-wrong-marker-scan.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dialogue-audit/_postmerge-wrong-marker-candidates.md
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Generate wrong-marker review report"
            git push
          fi
