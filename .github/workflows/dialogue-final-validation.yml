name: Dialogue final validation

on:
  push:
    branches:
      - story/dialogue-audit-final-residuals-s95-s114
    paths:
      - .github/workflows/dialogue-final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: story/dialogue-audit-final-residuals-s95-s114
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate reader data
        run: npm run prepare:data
      - name: Regenerate dialogue audit
        run: npm run audit:dialogue
      - name: Commit generated artifacts if needed
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- src/data.json docs/dialogue-audit; then
            echo "Generated artifacts already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data.json docs/dialogue-audit
            git commit -m "Regenerate audited reader data"
            git push origin HEAD:story/dialogue-audit-final-residuals-s95-s114
          fi
      - name: Explicit full tests
        run: npm test
      - name: Explicit dialogue audit
        run: npm run audit:dialogue
      - name: Quality
        run: npm run quality
      - name: Web build
        run: npm run build
      - name: Performance budget
        run: npm run budget:perf
      - name: Single-file build
        run: npm run build:single
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium webkit
      - name: Chromium regressions + WebKit smoke
        run: npm run test:e2e
      - name: Verify no generated drift
        run: |
          npm run prepare:data
          npm run audit:dialogue
          git diff --check
          git diff --exit-code -- src/data.json docs/dialogue-audit
