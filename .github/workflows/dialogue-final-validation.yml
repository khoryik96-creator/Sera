name: Dialogue final clean validation

on:
  push:
    branches:
      - story/dialogue-audit-postmerge-context-and-mixed
    paths:
      - '.github/workflows/dialogue-final-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story/dialogue-audit-postmerge-context-and-mixed
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dialogue regeneration
        run: |
          npm run prepare:data
          npm run audit:dialogue
      - name: Unit and repository quality
        run: |
          npm test
          npm run quality
      - name: Builds and performance budget
        run: |
          npm run build
          npm run budget:perf
          npm run build:single
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium webkit
      - name: Chromium regressions and WebKit smoke
        run: npm run test:e2e
      - name: Verify prose wording and branch hygiene
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --check origin/main...HEAD
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          marker = re.compile(r'\[\[speaker:[a-z0-9_]+\]\]')
          root = Path('docs/prose')
          files = sorted(p.as_posix() for p in root.glob('FINAL_ARC_SEASON*_PROSE_DRAFT*.md'))
          bad=[]
          for path in files:
              branch=Path(path).read_text()
              try:
                  base=subprocess.check_output(['git','show',f'origin/main:{path}'],text=True)
              except subprocess.CalledProcessError:
                  bad.append((path,'missing on main'))
                  continue
              if marker.sub('',branch).replace('\r\n','\n') != marker.sub('',base).replace('\r\n','\n'):
                  bad.append((path,'wording differs after stripping speaker markers'))
          if bad:
              print('Prose integrity failures:', *bad, sep='\n')
              sys.exit(1)
          print(f'Prose integrity OK for {len(files)} final-arc draft files.')
          PY
          if find scripts docs/dialogue-audit .github/workflows -maxdepth 2 -type f \( -name '*postmerge*' -o -name '*wrong-marker*' -o -name '*inline-residual*' -o -name '*final-corrections*' -o -name '*readme-final*' \) | grep -v 'dialogue-final-validation.yml' | grep -q .; then
            echo 'Temporary dialogue audit files remain:'
            find scripts docs/dialogue-audit .github/workflows -maxdepth 2 -type f \( -name '*postmerge*' -o -name '*wrong-marker*' -o -name '*inline-residual*' -o -name '*final-corrections*' -o -name '*readme-final*' \)
            exit 1
          fi
      - name: Remove this temporary validation workflow
        if: success()
        run: |
          rm .github/workflows/dialogue-final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/dialogue-final-validation.yml
          git commit -m "Remove temporary final validation workflow"
          git push
