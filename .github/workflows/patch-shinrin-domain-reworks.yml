name: Patch Shinrin domain approvals and reworks
on:
  push:
    branches: [story/next-arc-outline]
    paths: ['.github/workflows/patch-shinrin-domain-reworks.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/next-arc-outline
      - name: Patch martial approval ledger
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('docs/FINAL_ARC_SHINRIN_MARTIAL_LOCKS.md')
          s = p.read_text()

          s = s.replace('# 7. PROPOSED REWORK — #3 Haru Ishikawa', '# 7. LOCKED — #3 Haru Ishikawa')
          s = s.replace('## Proposed Domain — Carved Spear Dominion', '## Carved Spear Dominion — LOCKED')
          s = s.replace('# 8. PROPOSED REWORK — #4 Hana Arakawa', '# 8. LOCKED — #4 Hana Arakawa')
          s = s.replace('## Proposed Domain — Hollow Sky Dominion', '## Hollow Sky Dominion — LOCKED')

          sec6 = '''# 6. PROPOSED REWORK — #1 Tsubasa Kurokawa

**Keep current direction:** Peak-Paragon longbow specialist. Existing signature skills remain unless separately changed.

## Proposed Domain — **Silent Hunt Dominion**

Every arrow Tsubasa fires that remains intact inside the Domain can become a temporary **hunt stake** when it embeds in terrain, walls, trees or structures.

The arrow continues radiating Tsubasa's bow qi into the surrounding area.

### Enemy weakening

A hostile target entering the influence of one hunt stake feels a faint bowstring-like pressure through muscles and circulation.

One stake is irritating rather than decisive.

But multiple overlapping stakes compound:

- muscles remain slightly tensed even between movements;
- breathing becomes shallower under exertion;
- qi recovery between techniques slows;
- explosive qinggong becomes harder to repeat cleanly;
- fine evasive movement becomes increasingly tiring;
- sustained exposure creates fatigue and small timing errors.

The Domain therefore lets Tsubasa **build suppression by shooting the battlefield itself**.

A missed arrow is not automatically wasted.

### Tsubasa's advantage

Arrows Tsubasa fires through overlapping hunt-stake zones receive cleaner bow-qi resonance:

- less wobble;
- faster stabilization after release;
- better penetration retention over distance;
- easier chaining of rapid follow-up shots.

### Counterplay

- enemies can destroy embedded arrows;
- leaving an overlapped zone reduces the suppression;
- Tsubasa must physically seed the battlefield first;
- one or two stakes are manageable;
- the Domain becomes terrifying when a prolonged battle allows dozens of arrows to shape the field.

**Identity:** Tsubasa does not merely shoot at people. He gradually turns the entire battlefield into his hunting ground, where every missed arrow makes the next dodge harder.

---
'''
          s = re.sub(r'# 6\. PROPOSED REWORK — #1 Tsubasa Kurokawa.*?(?=# 7\.)', sec6, s, flags=re.S)

          sec9 = '''# 9. PROPOSED REWORK — #9 Eirik Voss

**Keep current direction:** former Isgard leader / longsword and shield / battlefield commander.

## Proposed Domain — **Crown Tithe Dominion**

Inside the Domain, every hostile high-output qi technique becomes **less efficient**.

Eirik's Domain imposes a martial "tithe" on hostile qi released with offensive or forceful intent.

### Enemy weakening

Whenever an enemy activates a major technique, burst movement, external qi attack, reinforced weapon art or heavy defensive release:

- the technique costs noticeably more qi than it normally would;
- part of the released qi is stripped away into the Domain before it can contribute fully to the technique;
- repeated high-output fighting therefore drains hostile reserves much faster;
- the more extravagant the technique, the greater the absolute amount wasted.

This does **not** cancel techniques or reduce cultivation level.

A skilled enemy can still fight efficiently by using tighter circulation, simpler attacks and less wasteful output.

### Eirik's advantage

The stripped hostile qi is not absorbed directly into Eirik's meridians.

Instead, Crown Tithe Dominion converts part of it into a neutralized reserve Eirik can distribute in small amounts to himself or willing allies.

It cannot transfer cultivation, techniques, health or lifespan.

Foreign qi is heavily filtered and loses efficiency during conversion, so the Domain cannot create infinite energy.

### Why it suits Eirik

Eirik ruled Isgard by deciding where limited strength had to be spent.

His Domain makes that philosophy literal:

- enemies spend more to accomplish the same thing;
- his side wastes less;
- long battles increasingly favor the side under his command.

**Identity:** fight under Eirik's crown and every large expenditure costs you more than it should.

---
'''
          s = re.sub(r'# 9\. PROPOSED REWORK — #9 Eirik Voss.*?(?=# 10\.)', sec9, s, flags=re.S)

          sec10 = '''# 10. PROPOSED REWORK — #10 Nao Shibasaki

**Keep current direction:** flowing jian / Water-Qi swordsmanship / sympathetic defensive personality.

## Proposed Domain — **Ebbing Sea Dominion**

Nao's Domain controls **recovery**, not raw output.

Inside it, hostile cultivators can still spend the qi already in their bodies at full strength, but the natural process of recovering spent qi becomes drastically worse.

### Enemy weakening

For hostile targets:

- ambient qi becomes difficult to draw back into the body;
- meridians refill more slowly after major techniques;
- breathing exercises recover less reserve than normal;
- repeated burst movement and heavy techniques become progressively harder to sustain;
- once reserve is spent, very little of it returns while the Domain remains active.

The Domain does not directly steal their existing reserve.

It simply makes **replenishment ebb away**.

### Nao's advantage

Nao's Water-Qi cultivation is built around continuous recirculation.

Inside Ebbing Sea Dominion:

- a much larger portion of her spent Water Qi is gathered back into her circulation;
- long defensive sequences become unusually efficient;
- she can maintain flowing sword forms far longer than an opponent can maintain repeated explosive techniques.

She still has a finite reserve and can be overwhelmed by sufficiently superior power.

### Battlefield effect

At the beginning of a fight, an enemy may barely notice the Domain.

After several Supreme techniques or repeated high-speed exchanges, the difference becomes obvious:

Nao is still circulating smoothly.

The enemy realizes the power they spent **is not coming back**.

**Identity:** Ebbing Sea Dominion wins by making every enemy expenditure permanent while Nao keeps reclaiming part of her own tide.

---
'''
          s = re.sub(r'# 10\. PROPOSED REWORK — #10 Nao Shibasaki.*?(?=# 11\.)', sec10, s, flags=re.S)

          s = re.sub(r'# 11\. Current Approval State.*', '''# 11. Current Approval State

## LOCKED
- #2 Jin Takamori — skills + Hundred Locks Dominion.
- #3 Haru Ishikawa — skills + Carved Spear Dominion.
- #4 Hana Arakawa — skills + Hollow Sky Dominion.
- #5 Kai Moriyama — skills + revised Crimson Crucible Dominion.
- #6 Aya Katsuragi — skills + revised Hundred Pulse Dominion / Paralytic Pulse.
- #7 Kenji Narukami — skills + revised Stormstep Dominion.
- #8 Jun Kajihara — skills + revised Breach Dominion.

## STILL PROPOSED
- #1 Tsubasa Kurokawa — **Silent Hunt Dominion**.
- #9 Eirik Voss — **Crown Tithe Dominion**.
- #10 Nao Shibasaki — **Ebbing Sea Dominion**.
''', s, flags=re.S)
          p.write_text(s)
      - name: Remove helper workflow
        run: rm .github/workflows/patch-shinrin-domain-reworks.yml
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FINAL_ARC_SHINRIN_MARTIAL_LOCKS.md .github/workflows/patch-shinrin-domain-reworks.yml
          git commit -m "docs: lock Haru Hana and rework remaining domains"
          git push origin HEAD:story/next-arc-outline
