name: Dialogue Manual Map
on:
  push:
    branches: [story/dialogue-audit-season95]
    paths: [scripts/dialogue-manual-map.mjs]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: story/dialogue-audit-season95
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded manual map
        run: node scripts/run-dialogue-manual-map.mjs
      - run: npm run prepare:data
      - run: npm test
      - run: npm run audit:dialogue
      - name: Commit prose markers and regenerated worklists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prose/FINAL_ARC_SEASON*_PROSE_DRAFT*.md docs/dialogue-audit
          git commit -m "Resolve manual dialogue speaker batch"
          git push
