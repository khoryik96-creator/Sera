name: Apply continuity fixes

on:
  push:
    branches:
      - fix/cross-arc-continuity-four

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/cross-arc-continuity-four
          fetch-depth: 0

      - name: Apply four continuity fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8')
              print(f'{path}: replaced {found} occurrence(s)')

          data = 'src/data.json'

          # 1) Qin's live/current metadata must match the wartime reveal in Chapters 291/299.
          replace_exact(
              data,
              '"cultivation": "Sovereign (secretly restored) — comparable to Liang Yue"',
              '"cultivation": "Peak Sovereign"'
          )

          # 2) Tae/Huo did not receive a permanent Garden passive during the five-year withdrawal,
          #    but Rhen temporarily extends the evolved passive to Tae, Huo and Qin during the war.
          replace_exact(
              data,
              'He was healed by Rhen after a near-fatal poisoning, though Rhen refuses to extend the Frozen Petals Garden passive to him.',
              'He was healed by Rhen after a near-fatal poisoning. During the five-year withdrawal Rhen refuses to make Frozen Petals Garden part of Tae’s standing protection; during the later Wuyue–Isgard war, Rhen temporarily extends the evolved passive to Tae, Huo and Qin for wartime refinement.'
          )
          replace_exact(
              data,
              'Rhen removed it and healed him but declined to extend his passive field. Tae stayed long enough to understand the organization, joined conditionally during Year Three, and after a sustained probation of recovery, clinic work and training apprentices, Sera formally appointed him Senior Sepal and third-in-command in early Year Four.',
              'Rhen removed it and healed him but declined any permanent passive extension. Tae stayed long enough to understand the organization, joined conditionally during Year Three, and after a sustained probation of recovery, clinic work and training apprentices, Sera formally appointed him Senior Sepal and third-in-command in early Year Four. During the later war Rhen temporarily includes Tae in the evolved Garden alongside Huo and Qin; the wartime extension aids survival and refinement rather than granting his realm.'
          )
          replace_exact(
              data,
              'Once Sera approves an offensive deployment he carries battlefield authority equal to Tae’s, but no equivalent administrative seniority, and he does not receive Rhen’s Frozen Petals Garden passive.',
              'Once Sera approves an offensive deployment he carries battlefield authority equal to Tae’s, but no equivalent administrative seniority. During the five-year withdrawal he does not receive Rhen’s Frozen Petals Garden passive; during the later Wuyue–Isgard war Rhen temporarily extends the evolved passive to Huo, Tae and Qin for wartime refinement.'
          )
          replace_exact(
              data,
              'Healed within the guild, he carries High Sovereign cultivation but is not extended Rhen’s passive.',
              'Healed within the guild, he carries High Sovereign cultivation without any permanent extension of Rhen’s passive. During the later war he is temporarily included in the evolved Garden with Tae and Qin; that wartime protection and refinement does not replace his own cultivation.'
          )

          # 3) Huo can exercise battlefield authority after Sera authorizes a deployment,
          #    but the Quiet Hand remains Sera's organization and the forty are not Huo's personal command.
          replace_exact(
              data,
              'served under Sera’s sealed battlefield authority or commanded forty specialists across two continents.',
              'served under Sera’s sealed battlefield authority or deployed alongside forty specialists across two continents under her organizational command.'
          )

          # 4) Black-Wick Lantern is a signal route/device, never an enemy guild.
          replace_exact(
              'docs/STORY_SKELETON_LOCK.md',
              'one-use **Black-Wick Lantern** route',
              'one-use **Black-Wick Lantern signal route**'
          )
          replace_exact(
              'docs/BENEATH_THE_CROOKED_SIGN_OUTLINE.md',
              'one-use **Black-Wick Lantern** route',
              'one-use **Black-Wick Lantern signal route**'
          )
          replace_exact(
              'docs/WHERE_THE_BLACK_WICK_LEADS_OUTLINE.md',
              "This arc answers Jin's Black-Wick Lantern signal, rescues the Five Dukes and opens Isgard without explaining the entire northern continent.",
              "This arc answers Jin's Black-Wick Lantern signal route, rescues the Five Dukes and opens Isgard without explaining the entire northern continent. The Black-Wick Lantern is a one-use authenticated signal device and route, never a guild or faction; Duskvein Guild remains the first northern enemy guild."
          )

          # Clarify the Chapter 184 outline at the same command boundary used by the prose.
          replace_exact(
              'docs/WHERE_THE_BLACK_WICK_LEADS_OUTLINE.md',
              'Tor asks who placed eighty specialists inside twelve armies without detection and moved forty of them across the continent behind Huo. Sera accepts responsibility but gives neither The Quiet Hand\'s name nor its structure, turning the demand into proof that disclosure would create the threat Veyrhald claims to fear.',
              'Tor asks who placed eighty specialists inside twelve armies without detection and moved forty of them across the continent as an attached reinforcement column travelling behind Huo. Sera makes the command boundary explicit: the Quiet Hands remain under her organizational authority, while Huo may direct their battlefield employment only after her deployment order. She gives neither The Quiet Hand\'s name nor its structure, turning the demand into proof that disclosure would create the threat Veyrhald claims to fear.'
          )

          # Clarify any prose use that calls the Black-Wick mechanism a route without saying what kind.
          p = Path(data)
          text = p.read_text(encoding='utf-8')
          text = text.replace('Black-Wick Lantern route', 'Black-Wick Lantern signal route')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate JSON and changed scope
        shell: bash
        run: |
          python -m json.tool src/data.json >/dev/null
          git diff --check
          git status --short

      - name: Commit patched files and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-continuity-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.json docs/STORY_SKELETON_LOCK.md docs/BENEATH_THE_CROOKED_SIGN_OUTLINE.md docs/WHERE_THE_BLACK_WICK_LEADS_OUTLINE.md .github/workflows/apply-continuity-fixes.yml
          git commit -m "Fix remaining cross-arc continuity issues"
          git push origin HEAD:fix/cross-arc-continuity-four
