name: Apply corrected Rhen seclusion timing
on:
  push:
    branches:
      - story/next-arc-outline
    paths:
      - .github/workflows/apply-rhen-seclusion-timing.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/next-arc-outline
          fetch-depth: 0
      - run: python scripts/apply_rhen_seclusion_timing.py
      - run: |
          grep -q 'enters seclusion one day before Yun Shizhen' docs/FINAL_ARC_POWER_OPTIONS.md
          grep -q 'Rhen Enters Seclusion One Day Before Yun' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          grep -q 'Permanent title: Black Radiance' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          grep -q 'four Established Paragons' docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FINAL_ARC_POWER_OPTIONS.md docs/FINAL_ARC_SHINRIN_FOUNDATION.md
          git rm scripts/apply_rhen_seclusion_timing.py .github/workflows/apply-rhen-seclusion-timing.yml
          git commit -m 'Lock corrected Rhen seclusion timing and Black Radiance'
          git push origin HEAD:story/next-arc-outline
