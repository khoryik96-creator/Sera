name: Dialogue postmerge safe apply

on:
  push:
    branches:
      - story/dialogue-audit-postmerge-context-and-mixed
    paths:
      - 'scripts/apply-dialogue-postmerge-safe.mjs'
      - '.github/workflows/dialogue-postmerge-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/dialogue-audit-postmerge-context-and-mixed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed and explicit mixed dialogue markers
        run: node scripts/apply-dialogue-postmerge-safe.mjs
      - name: Regenerate reader data and dialogue worklists
        run: |
          npm run prepare:data
          npm run audit:dialogue
      - name: Run unit tests
        run: npm test
      - name: Commit safe dialogue pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prose src/novel.ts test/novel.test.ts src/data docs/dialogue-audit/season-*.md
          if git diff --cached --quiet; then
            echo "No dialogue changes"
          else
            git commit -m "Highlight explicit mixed dialogue and reviewed residuals"
            git push
          fi
